var MECH = [
{
 zh:'复眼里的三类受体', en:'Three receptor classes in the compound eye', ms:'Tiga kelas reseptor dalam mata majmuk',
 tier:'measured',
 bodyZh:'多数昆虫是紫外–蓝–绿三色型，受体峰值大致落在 350、440、530 nm 附近。这套配置在昆虫里相当保守：熊蜂实测 347／424／539 nm，蚜虫约 330、490、530 nm，白粉虱的视网膜电图（ERG，在眼表记录电信号）峰值在约 340 与 520 nm。少数类群多出第四类——某些蝴蝶有对长波敏感的红受体，把可见范围往红端延伸。',
 bodyEn:'Most insects are UV-blue-green trichromats with receptor peaks near 350, 440 and 530 nm. The layout is conservative across the class: bumblebees measure at 347/424/539 nm, aphids near 330, 490 and 530, and whitefly electroretinogram (ERG, voltage recorded at the eye surface) peaks sit near 340 and 520. A minority add a fourth class — some butterflies carry a long-wavelength red receptor extending their range toward the red end.', bodyMs:'Kebanyakan serangga ialah trikromat UV-biru-hijau dengan puncak reseptor sekitar 350, 440 dan 530 nm. Susunan ini hampir sama merentas seluruh kelas serangga: lebah bumble diukur pada 347/424/539 nm, afid sekitar 330, 490 dan 530, dan puncak elektroretinogram (ERG, voltan yang direkod pada permukaan mata) lalat putih terletak sekitar 340 dan 520. Sebilangan kecil menambah kelas keempat — sesetengah rama-rama siang (butterfly) mempunyai reseptor merah gelombang panjang yang meluaskan julat penglihatan mereka ke arah hujung merah.',
 soZh:'由此推出一条硬性限制：红光（>620 nm）对绝大多数昆虫近乎不存在。不是因为红光弱，而是因为它们没有接收红光的受体。',
 soEn:'That yields a hard constraint: red light beyond 620 nm barely exists for most insects — not because red is weak, but because they have no receptor to catch it.', soMs:'Ini menghasilkan satu kekangan tegas: cahaya merah melebihi 620 nm hampir tidak wujud bagi kebanyakan serangga — bukan kerana merah lemah, tetapi kerana mereka tiada reseptor untuk menangkapnya.'
},
{
 zh:'颜色拮抗：为什么黄板比绿板好', en:'Colour opponency: why yellow beats green', ms:'Pertentangan warna: mengapa kuning mengatasi hijau',
 tier:'field',
 bodyZh:'刺吸类昆虫的降落反应不由「哪个受体被激发最多」决定，而由长波与短波的比值决定：绿受体（约 500–640 nm）给正输入，蓝与紫外受体（约 300–500 nm）给负输入。黄色反射面长波极高、短波极低，这个比值比任何真实叶片都极端——文献称之为「超常态叶片信号」。它不是「像嫩叶」，是「比嫩叶更像嫩叶」。<br><br>正负号是怎么判定的？电生理只列出「有哪些接收器」，分不出正负；正负来自行为试验。最干净的证据是<b>白板</b>：白色反射的绿黄光比黄板还多——白就是黄再加上蓝和紫外——按「绿受体激发越强越吸引」应该白板赢，实际上蚜虫几乎不上白板。多出来的只有短波，所以短波一定在扣分。研究上的标准做法是固定长波、逐步加入短波，看反应下降（负权重）还是上升（木虱的紫外相加就是这样被发现的）。还有一点：「正受体＝绿」不是定律，是「找叶面」这个问题的答案——同一只白粉虱，绿通道对降落是正，紫外通道对起飞是正。<b>正负属于行为，不属于受体本身。</b>',
 bodyEn:'The landing response in sap-feeders is not driven by which receptor fires hardest but by the ratio of long-wave to short-wave <b>receptor excitation</b> — not raw light energy; each receptor first filters the light through its own sensitivity curve, and the comparison happens downstream: positive input from the green receptor (about 500–640 nm), negative from blue and UV (about 300–500 nm). A yellow surface is very high long-wave and very low short-wave, a ratio more extreme than any real leaf. The literature calls it a supernormal foliage stimulus — not leaf-like, but more leaf-like than a leaf.<br><br>How were the signs established? Electrophysiology only lists the receivers; it cannot assign signs. Those come from behaviour, and the cleanest evidence is the <b>white card</b>: white reflects more green-yellow light than yellow does — white is yellow plus blue plus UV — so if attraction ran on green-receptor excitation alone, white should win. Aphids largely ignore white. The only surplus is short-wave, so short-wave must be subtracting. The laboratory version holds the long-wave component constant and titrates short-wave in, watching the response fall (negative weight) or rise — which is how the psyllid\'s additive UV channel was caught. And one more thing: green-positive is not a law, it is the answer to the question <i>where is foliage</i> — the same whitefly is green-positive for landing and UV-positive for take-off. <b>The sign belongs to the behaviour, not to the receptor.</b>', bodyMs:'Tindak balas hinggap pada serangga penghisap cecair tumbuhan tidak ditentukan oleh reseptor mana yang bertindak balas paling kuat, tetapi oleh nisbah <b>pengujaan reseptor</b> gelombang panjang kepada gelombang pendek — bukan tenaga cahaya mentah; setiap reseptor terlebih dahulu menapis cahaya melalui lengkung kepekaannya sendiri, dan perbandingan berlaku di peringkat seterusnya: input positif daripada reseptor hijau (kira-kira 500–640 nm), negatif daripada biru dan UV (kira-kira 300–500 nm). Permukaan kuning sangat tinggi gelombang panjang dan sangat rendah gelombang pendek, satu nisbah yang lebih ekstrem daripada mana-mana daun sebenar. Literatur menyebutnya rangsangan dedaun luar biasa (supernormal) — bukan seperti daun, tetapi lebih \'daun\' daripada daun itu sendiri.<br><br>Bagaimanakah tanda positif dan negatif ini ditentukan? Elektrofisiologi hanya menyenaraikan penerimanya; ia tidak dapat menetapkan tanda. Tanda itu datang daripada tingkah laku, dan bukti paling jelas ialah <b>papan putih</b>: putih memantulkan lebih banyak cahaya hijau-kuning berbanding kuning — putih ialah kuning ditambah biru ditambah UV — jadi jika tarikan bergantung pada pengujaan reseptor hijau semata-mata, putih sepatutnya menang. Afid sebahagian besarnya mengabaikan putih. Satu-satunya lebihan ialah gelombang pendek, jadi gelombang pendek mesti bertindak menolak. Versi makmal mengekalkan komponen gelombang panjang tetap dan menambah gelombang pendek sedikit demi sedikit, sambil memerhati tindak balas menurun (pemberat negatif) atau meningkat — begitulah saluran UV tambahan psilid dikesan. Dan satu perkara lagi: hijau-positif bukan satu hukum, ia ialah jawapan kepada soalan <i>di manakah dedaun</i> — lalat putih yang sama adalah hijau-positif untuk hinggap dan UV-positif untuk berlepas terbang. <b>Tanda itu milik tingkah laku, bukan milik reseptor.</b>',
 soZh:'三条可以直接用的推论：不透光黄板比半透明的捕获量高 1.5–7 倍（透光会漏进短波、压低比值），加印黑色图案还能再提高；蓝绿混合会互相抵消，因为蓟马对蓝和绿各有一套独立机制；木虱对「黄＋紫外」的反应强于纯黄，即使总亮度更低——完全滤掉紫外未必划算。',
 soEn:'Three usable consequences. Opaque cards out-catch translucent ones by 1.5–7× because translucency leaks short-wave energy and flattens the ratio, and printed black patterns add more. Mixed blue-green cancels itself, because thrips run blue and green as two separate mechanisms. And psyllids respond more strongly to yellow plus UV than to yellow alone even at lower total intensity, so filtering UV out completely is not automatically a gain.', soMs:'Tiga akibat yang boleh digunakan. Papan legap menangkap 1.5–7× lebih banyak daripada papan lut cahaya kerana sifat lut cahaya membocorkan tenaga gelombang pendek dan meratakan nisbah, dan corak hitam bercetak meningkatkan lagi tangkapan. Campuran biru-hijau saling membatalkan, kerana trips memproses biru dan hijau sebagai dua mekanisme berasingan. Dan psilid bertindak balas lebih kuat terhadap kuning ditambah UV berbanding kuning sahaja walaupun pada keamatan keseluruhan yang lebih rendah, jadi menapis UV sepenuhnya tidak semestinya satu kelebihan.'
},
{
 zh:'白天的色面，与夜间的光源', en:'A lit surface by day, a light source by night', ms:'Permukaan disinari pada siang hari, sumber cahaya pada malam hari',
 tier:'mech',
 bodyZh:'这是整个领域最容易被混掉的一条。反射诱引（黏板）在白天成立：环境光照亮一个色面，昆虫在找寄主，色面提供的是降落信号。没有阳光就没有信号——夜里的黄板是一块黑板。主动光源（诱虫灯）在夜间成立：光源本身比背景亮，触发的是完全不同的一套飞行行为。',
 bodyEn:'This is the distinction most often collapsed. Reflective attraction — sticky cards — works by day: ambient light illuminates a coloured surface, the insect is host-searching, and the surface supplies a landing cue. No sunlight, no cue; a yellow card at night is a black card. An active source — a trap lamp — works at night, when the source outshines the background, and it triggers an entirely different flight behaviour.', bodyMs:'Inilah perbezaan yang paling kerap dicampuradukkan. Tarikan pantulan — perangkap melekit — berfungsi pada waktu siang: cahaya persekitaran menerangi permukaan berwarna, serangga sedang mencari perumah, dan permukaan itu memberikan isyarat untuk hinggap. Tiada cahaya matahari, tiada isyarat; papan kuning pada waktu malam ialah papan hitam. Sumber aktif — lampu perangkap — berfungsi pada waktu malam, apabila sumber itu lebih terang daripada latar belakang, dan ia mencetuskan tingkah laku terbang yang sama sekali berbeza.',
 soZh:'把两者合并成一张「波长 × 昆虫」表，就会推出「580 nm 黄灯可以夜间诱蚜虫」这种<b>错误结论</b>。它错两次：蚜虫夜里根本不飞（白天迁飞、天黑前降落）；而且它对黄的反应是白天挑叶面降落的反应，不是扑向光源的趋光——夜里的黄灯等于对着空场放广告。挑选任何一条建议时，先看它讲的是黏板还是灯。',
 soEn:'Collapse the two into one wavelength-by-insect table and you derive <b>false conclusions</b> like "a 580 nm lamp will pull aphids at night". That one is wrong twice over: aphids do not fly at night at all (they migrate by day and settle before dark), and their yellow response is a daytime landing decision on surfaces, not phototaxis toward a source — a yellow lamp after dark is advertising to an empty sky. Before acting on any recommendation, check whether it is about a card or a lamp.', soMs:'Gabungkan kedua-duanya dalam satu jadual panjang gelombang mengikut serangga dan anda akan memperoleh <b>kesimpulan palsu</b> seperti "lampu 580 nm akan menarik afid pada waktu malam". Kesimpulan itu salah dua kali: afid langsung tidak terbang pada waktu malam (mereka berhijrah pada waktu siang dan hinggap sebelum gelap), dan tindak balas mereka terhadap kuning ialah keputusan hinggap pada permukaan di siang hari, bukan fototaksis ke arah sumber cahaya — lampu kuning selepas gelap hanya mengiklankan dirinya kepada langit yang kosong. Sebelum bertindak atas sebarang cadangan, semak sama ada ia mengenai papan atau lampu.'
},
{
 zh:'夜间「趋光」其实是背光反射失灵', en:'Night "phototaxis" is a hijacked orientation reflex', ms:'"Fototaksis" malam ialah refleks orientasi yang dirampas',
 tier:'measured',
 bodyZh:'2024 年的三维飞行轨迹研究（实验室动作捕捉＋哥斯达黎加野外立体摄影）发现：昆虫并不朝光源转向，而是把背部转向光源，结果飞出与光源垂直的航线。这叫背光反射——在自然界，最亮的半球就是天空，背朝它就知道哪边是上。人造光源把这个基准打乱，于是出现绕圈、失速、翻转。「向光逃生」和「月亮导航」两套旧解释都被这批数据排除了。',
 bodyEn:'The 2024 three-dimensional flight-path study — lab motion capture plus stereo videography in Costa Rica — found that insects do not steer toward light. They turn their dorsum toward it, producing flight paths perpendicular to the source. This is the dorsal light response: in nature the brightest hemisphere is the sky, so backing onto it tells them which way is up. An artificial source corrupts that reference, producing the orbiting, stalling and inverting. The older "escape to light" and "lunar navigation" explanations were both ruled out by this data.', bodyMs:'Kajian laluan terbang tiga dimensi 2024 — tangkapan gerakan di makmal serta videografi stereo di Costa Rica — mendapati serangga tidak mengemudi ke arah cahaya. Mereka memalingkan bahagian dorsum (belakang badan) ke arahnya, menghasilkan laluan terbang yang berserenjang dengan sumber. Ini ialah tindak balas cahaya dorsal: di alam semula jadi, hemisfera paling terang ialah langit, jadi membelakanginya memberitahu mereka arah atas. Sumber buatan merosakkan rujukan itu, menyebabkan serangga berlegar mengelilingi, terhenti dan terbalik. Penjelasan lama "melarikan diri ke arah cahaya" dan "navigasi bulan" kedua-duanya telah ditolak oleh data ini.',
 soZh:'三条推论：诱虫灯是短距离装置，困住飞近的虫而不是把远处的虫拉过来，所以「一盏灯覆盖 N 英亩」的算法不成立；灯的位置比功率重要，应该放在虫源方向而不是园子中央；避虫照明最有效的一步是遮光罩和向下打光，其次才是换灯泡颜色。',
 soEn:'Three consequences. A trap lamp is short-range — it traps what flies close rather than drawing insects in, so "one lamp covers N acres" does not hold. Placement beats wattage: site lamps toward the source, not in the middle of the block. And for keeping insects away, shielding and aiming downward do more than changing the bulb colour.', soMs:'Tiga akibat. Lampu perangkap berjarak dekat — ia memerangkap apa yang terbang berhampiran dan bukannya menarik serangga masuk, jadi "satu lampu meliputi N ekar" tidak benar. Kedudukan lebih penting daripada watt: letakkan lampu menghala ke arah sumber serangga, bukan di tengah-tengah blok. Dan untuk menjauhkan serangga, melindungi lampu dengan pelindung dan menghalakannya ke bawah lebih berkesan daripada menukar warna mentol.'
},
{
 zh:'两套相反的光反应：飞走，还是降落', en:'Two opposing light responses: fly, or land', ms:'Dua tindak balas cahaya bertentangan: terbang, atau hinggap',
 tier:'measured',
 bodyZh:'蚜虫在 330–340 nm 有一个实测的紫外受体，但它驱动的不是「被吸引过来」，而是起飞和维持迁飞——紫外是「开阔天空」的信号，意思是往上、离开叶面。降落是另一套：由绿受体主导的长波信号（约 530–580 nm）触发，意思是往下、停在这个面上。两套行为是中枢性拮抗的：蚜虫的经典试验显示飞行会主动抑制降落反应。白粉虱上量得更干脆——400 nm 触发起飞与持续飞行，550 nm 触发降落，两条通路互不干涉。',
 bodyEn:'Aphids carry a measured UV receptor at 330–340 nm, but what it drives is not attraction — it is take-off and the maintenance of migratory flight. UV is the open-sky signal, meaning up and away from foliage. Landing is a separate system, driven by long-wavelength input through the green receptor around 530–580 nm, meaning down and onto this surface. The two are centrally antagonistic: classic aphid experiments showed flight actively inhibits the settling response. Whitefly gives the cleanest measurement — 400 nm elicits take-off and sustained flight, 550 nm elicits settling, and the two pathways do not interact.', bodyMs:'Afid mempunyai reseptor UV yang telah diukur pada 330–340 nm, tetapi apa yang dipacunya bukan tarikan — ia ialah tindakan berlepas terbang dan pengekalan penerbangan migrasi. UV ialah isyarat langit terbuka, bermaksud ke atas dan menjauhi dedaun. Hinggap ialah sistem berasingan, dipacu oleh input panjang gelombang panjang melalui reseptor hijau sekitar 530–580 nm, bermaksud ke bawah dan ke atas permukaan ini. Kedua-duanya saling bertentangan di peringkat pusat: eksperimen afid klasik menunjukkan penerbangan secara aktif merencat tindak balas hinggap. Lalat putih memberikan ukuran paling jelas — 400 nm mencetuskan berlepas dan penerbangan berterusan, 550 nm mencetuskan hinggap, dan kedua-dua laluan itu tidak berinteraksi.',
 soZh:'所以紫外灯对蚜虫不是「效果差的诱捕」，而是发错了信号：它说的是「继续飞」。光谱页把蚜虫 320–360 nm 标成「起飞反应（非诱捕）」而不是删掉，正是因为两种处理都会误导——删掉等于说蚜虫在 350 nm 看不见（它有实测受体），标成「灯」等于说紫外灯能诱到蚜虫（它不能）。真正可用的方向是反过来：紫外不足的环境会降低蚜虫、白粉虱、蓟马的飞行活动与迁入，这正是滤紫外薄膜和光选择性防虫网的原理。育苗区用得上，开阔的榴莲冠层用不上。',
 soEn:'So a UV lamp aimed at aphids is not a weak trap — it is the wrong signal, and what it says is keep flying. The Spectrum tab marks the aphid 320–360 nm band as "take-off (not a trap)" rather than deleting it, because either alternative would mislead: removing it implies aphids are blind at 350 nm, which is false, and labelling it "lamp" implies a UV lamp catches aphids, which is also false. The usable move is the reverse one — UV-deficient environments reduce flight activity and immigration of aphids, whiteflies and thrips, which is the principle behind UV-blocking films and photoselective nets. Workable in a nursery block, not over an open durian canopy.', soMs:'Jadi lampu UV yang ditujukan kepada afid bukanlah perangkap yang lemah — ia ialah isyarat yang salah, dan mesejnya ialah teruskan terbang. Tab Spektrum menandakan jalur afid 320–360 nm sebagai "berlepas (bukan perangkap)" dan bukannya memadamkannya, kerana kedua-dua alternatif lain akan mengelirukan: membuangnya membayangkan afid buta pada 350 nm, yang tidak benar, dan melabelkannya "lampu" membayangkan lampu UV menangkap afid, yang juga tidak benar. Langkah yang boleh digunakan ialah sebaliknya — persekitaran kurang UV mengurangkan aktiviti terbang dan kemasukan afid, lalat putih dan trips, iaitu prinsip di sebalik filem penghalang UV dan jaring fotoselektif. Boleh dilaksanakan di blok tapak semaian, tetapi tidak di atas kanopi durian yang terbuka.'
},
{
 zh:'感光峰值 ≠ 最佳诱捕颜色', en:'Receptor peak is not best trap colour', ms:'Puncak reseptor bukan warna perangkap terbaik',
 tier:'mech',
 bodyZh:'这是读任何一张光谱表时最该带着的一条。受体峰值是生理量，由电生理（记录眼睛对各波长的电信号）测出来；最佳诱捕颜色是行为量，由田间或选择试验测出来。两者经常不一样，而且不一样是有原因的：绿受体峰值在 530 nm，最好的黏板却是 560–600 nm 的黄。补上关键一步：<b>530 nm 处蓝受体还没归零</b>，负输入仍在扣分；到 585 nm，绿受体只降了一些，蓝受体却几乎降到零——所以比值在绿峰之外才达到最大。到「光谱」页把光标从 530 拖到 585，看蓝色那条曲线塌下去，就是这一步。',
 bodyEn:'Carry this into any spectral table you read. Receptor peak is a physiological quantity measured by electrophysiology — recording the eye\'s electrical response to each wavelength; best trap colour is a behavioural quantity measured in field or choice tests. They routinely differ, and the difference has a cause: the green receptor peaks at 530 nm while the best card is 560–600 nm yellow. The step that closes the gap: <b>at 530 nm the blue receptor has not yet reached zero</b>, so the negative input is still subtracting; by 585 nm green has dropped only somewhat while blue has collapsed almost entirely — which is why the ratio peaks beyond the green peak. Drag the cursor from 530 to 585 on the Spectrum tab and watch the blue curve fall away: that is this step, drawn.', bodyMs:'Bawa prinsip ini ke dalam mana-mana jadual spektrum yang anda baca. Puncak reseptor ialah kuantiti fisiologi yang diukur melalui elektrofisiologi — merekod tindak balas elektrik mata terhadap setiap panjang gelombang; warna perangkap terbaik ialah kuantiti tingkah laku yang diukur dalam ujian lapangan atau ujian pilihan. Kedua-duanya kerap berbeza, dan perbezaan itu ada puncanya: reseptor hijau memuncak pada 530 nm manakala papan terbaik ialah kuning 560–600 nm. Langkah yang merapatkan jurang itu: <b>pada 530 nm reseptor biru belum mencapai sifar</b>, jadi input negatif masih menolak; pada 585 nm hijau hanya menurun sedikit manakala biru hampir lenyap sepenuhnya — itulah sebabnya nisbah memuncak melepasi puncak hijau. Seret kursor dari 530 ke 585 pada tab Spektrum dan perhatikan lengkung biru menurun: itulah langkah ini, dalam bentuk lukisan.',
 soZh:'任何一张把两者放进同一列的表，都会在某个地方出错。本软件把它们分开列：虫谱页的「感光峰值」是前者，波段反应和选灯选板页是后者。',
 soEn:'Any table that puts both in one column will be wrong somewhere. They are kept apart here: the "Receptor peaks" line on each insect card is the first quantity; the band responses and the trap picker are the second.', soMs:'Mana-mana jadual yang meletakkan kedua-duanya dalam satu lajur akan salah di suatu tempat. Di sini kedua-duanya diasingkan: baris "Puncak reseptor" pada setiap kad serangga ialah kuantiti pertama; tindak balas jalur dan pemilih perangkap ialah kuantiti kedua.'
},
{
 zh:'光谱选择性与非靶标', en:'Spectral selectivity and non-targets', ms:'Selektiviti spektrum dan organisma bukan sasaran',
 tier:'field',
 bodyZh:'没有一种波长只对害虫有效。豇豆田对照：黄板黏到的益虫是蓝板的 1.7 倍，其中瓢虫占 63%、小花蝽占 29%。芒果园六色对照里，黄板对天敌冲击最大，白板最小。诱虫灯同样：把波长调离最佳点，蛾没有多捕到，非靶标却明显增加。茶园研究更直接地问了这个问题——黄板和诱虫灯捕到的天敌，可能比捕到的目标害虫还多。',
 bodyEn:'No wavelength is pest-specific. In cowpea trials yellow cards caught 1.7× the beneficials of blue — 63% ladybirds, 29% Orius. In a six-colour mango orchard trial, yellow hit natural enemies hardest and white lightest. Lamps behave the same way: tuning off the optimum caught no additional moths but distinctly more non-targets. Tea plantation work asks the question most directly — yellow cards and light traps may remove more natural enemies than target pests.', bodyMs:'Tiada panjang gelombang yang khusus untuk perosak sahaja. Dalam ujian kacang tunggak, papan kuning menangkap 1.7× lebih banyak serangga berfaedah berbanding biru — 63% kumbang kura-kura, 29% Orius. Dalam ujian enam warna di dusun mangga, kuning paling banyak menjejaskan musuh semula jadi dan putih paling sedikit. Lampu berkelakuan sama: menala di luar panjang gelombang optimum tidak menangkap rama-rama tambahan tetapi jelas menangkap lebih banyak serangga bukan sasaran. Kajian di ladang teh menjawab soalan ini paling langsung — papan kuning dan lampu perangkap mungkin menyingkirkan lebih banyak musuh semula jadi daripada perosak sasaran.',
 soZh:'所以「监测密度」和「诱杀密度」是两个不同的决定，代价差一个数量级。监测：少量、位置固定、定期计数，用来决定什么时候动手。诱杀：铺满，用捕获量本身当防治——在封闭温室里证据较强，在开放的乔木果园里弱得多。',
 soEn:'That makes monitoring density and mass-trapping density two different decisions with costs an order of magnitude apart. Monitoring: a few cards, fixed positions, counted regularly, used to time an intervention. Mass trapping: saturation, where the catch itself is the control — well evidenced in closed greenhouses, far less so in open tree orchards.', soMs:'Ini menjadikan kepadatan pemantauan dan kepadatan perangkap besar-besaran dua keputusan berbeza, dengan kos yang berbeza kira-kira sepuluh kali ganda. Pemantauan: beberapa papan, kedudukan tetap, dikira secara berkala, digunakan untuk menentukan masa campur tangan. Perangkap besar-besaran: tahap tepu, di mana tangkapan itu sendiri ialah kawalan — terbukti kukuh di rumah hijau tertutup, jauh kurang di dusun pokok terbuka.'
},
{
 zh:'红光与避虫照明', en:'Red light and insect-free lighting', ms:'Cahaya merah dan pencahayaan bebas serangga',
 tier:'field',
 bodyZh:'先要摆正一件事：<b>红对昆虫不是一种颜色，是「暗」</b>。多数昆虫没有红受体，620–700 nm 在三条通路上都激发不出多少信号，所以一个红色表面在虫眼里不是红的，是接近黑的。红板如果真的捕到虫，多半靠的是明暗反差（浅色背景上的一块暗物），不是颜色偏好。长波因此是吸引力最低的区段：蛾对长波灯的趋性远低于紫外灯，灯型对照里捕获量随加权平均波长变长而下降。但「完全无影响」讲过头了，而且要分开讲：甘蓝夜蛾幼虫的发育试验里，绿光和白光影响了雄性幼虫的发育，红光则与全黑没有差别；性信息素试验里，红光却和绿光、暖白光一样降低了雌蛾的信息素分泌并改变了成分比例；野外交配试验中，全黑对照的交配率为 53%，红光下降到 28%。',
 bodyEn:'Start with the right framing: <b>red is not a colour to an insect, it is darkness</b>. Most insects have no red receptor, so 620–700 nm raises little signal in any of the three channels and a red surface reads as near-black rather than as red. Where red traps do catch, they are most likely working on brightness contrast — a dark object against a pale background — not on colour preference. Long wavelengths are therefore the least attractive band: moth phototaxis to long-wave lamps runs far below UV, and across lamp types catch falls as the weighted mean wavelength rises. But "no effect" overstates it, and the picture splits. In cabbage moth larval development trials, green and white light affected male caterpillars while red did not differ from darkness. In pheromone trials red did reduce female output and shift the blend, just as green and warm white did. And in a field mating trial, 53% of females mated under a dark control against 28% under red.', bodyMs:'Mulakan dengan rangka fikir yang betul: <b>merah bukan warna bagi serangga, ia ialah kegelapan</b>. Kebanyakan serangga tiada reseptor merah, jadi 620–700 nm hanya menghasilkan sedikit isyarat dalam mana-mana tiga saluran dan permukaan merah dilihat hampir hitam dan bukannya merah. Di mana perangkap merah memang menangkap, ia berkemungkinan besar bergantung pada kontras kecerahan — objek gelap berlatarkan latar belakang cerah — bukan pada pilihan warna. Oleh itu panjang gelombang panjang ialah jalur yang paling kurang menarik: fototaksis rama-rama terhadap lampu gelombang panjang jauh lebih rendah berbanding UV, dan merentas jenis lampu, tangkapan menurun apabila purata berwajaran panjang gelombang meningkat. Tetapi "tiada kesan" adalah keterlaluan, dan gambarannya berbelah. Dalam ujian perkembangan larva rama-rama kubis, cahaya hijau dan putih menjejaskan ulat jantan manakala merah tidak berbeza daripada gelap. Dalam ujian feromon, merah memang mengurangkan pengeluaran oleh betina dan mengubah campurannya, sama seperti hijau dan putih hangat. Dan dalam ujian pengawanan di lapangan, 53% betina mengawan di bawah kawalan gelap berbanding 28% di bawah merah.',
 soZh:'两件事看起来矛盾，其实是两个不同的门槛：<b>触发趋光</b>需要受体给出足够强的信号，红光远远达不到；<b>打乱夜间节律</b>只需要光子告诉身体「现在不算黑」，这个门槛低得多。所以红光可以既「诱不到虫」又「仍在干扰虫」——暗不等于没有。实际排序：先关掉不必要的灯，再加遮光罩并向下打光，最后才是换灯泡颜色，换灯泡是三步里最弱的一步。',
 soEn:'The two results only look contradictory because they sit at different thresholds. <b>Triggering phototaxis</b> needs a strong receptor signal, and red comes nowhere near it. <b>Disrupting a night rhythm</b> only needs photons telling the body it is not dark, and that bar is far lower. So red can genuinely fail to attract while still interfering — dark is not the same as absent. In order of effect: switch off what is not needed, then shield the fixture and aim it down, and only then change the bulb colour, which is the weakest of the three.', soMs:'Kedua-dua keputusan itu hanya kelihatan bercanggah kerana ia berada pada ambang yang berbeza. <b>Mencetuskan fototaksis</b> memerlukan isyarat reseptor yang kuat, dan merah jauh sekali daripada mencapainya. <b>Mengganggu ritma malam</b> hanya memerlukan foton yang memberitahu badan bahawa hari belum gelap, dan ambang itu jauh lebih rendah. Jadi merah benar-benar boleh gagal menarik sambil masih mengganggu — kelihatan gelap tidak sama dengan tiada langsung. Mengikut susunan kesan: matikan apa yang tidak diperlukan, kemudian pasang pelindung pada lampu dan halakan ke bawah, dan barulah tukar warna mentol, yang paling lemah antara ketiga-tiganya.'
},
{
 zh:'一条主轴，四套机理', en:'One axis, four mechanisms', ms:'Satu paksi, empat mekanisme',
 tier:'mech',
 bodyZh:'读完前面七张卡，可以把全软件收进一张地图。白天黏板的世界由一条主轴统治：长波与短波受体激发之比。偏长波＝叶面信号→降落，偏短波＝天空信号→起飞。黄板为什么赢、不透光规则、褪色失效、滤紫外薄膜，全是这条轴的推论。其余四套机理各管一块，谁也不归谁：蓟马另有独立的蓝通道（所以蓝绿混合互相抵消）；木虱是黄加紫外反而更强（相加，不是相减）；夜间灯诱与颜色比值无关，是背光反射被点光源劫持，所以灯的建议全部落在位置与距离上；红光与避虫照明走昼夜节律的「不黑就行」阈值；果实蝇干脆不在视觉里，主线索是气味。',
 bodyEn:'After the seven cards above, the whole app fits on one map. The daytime card world is ruled by a single axis: the ratio of long-wave to short-wave receptor excitation. Long-wave dominant reads as foliage — descend and settle; short-wave dominant reads as sky — take off and disperse. Why yellow wins, the opaque rule, fade failure and UV-blocking films are all corollaries of that one axis. Four further mechanisms each own their own territory: thrips carry an independent blue channel (why blue-green mixes cancel); psyllids respond to yellow-plus-UV more than yellow alone (addition, not subtraction); night lamps have nothing to do with colour ratios — a hijacked dorsal light response, which is why every lamp rule is about placement and range; red light and pest-aware lighting run on the circadian not-dark threshold; and fruit flies sit outside vision altogether, on odour.', bodyMs:'Selepas tujuh kad di atas, seluruh aplikasi ini muat dalam satu peta. Dunia papan perangkap waktu siang dikuasai oleh satu paksi tunggal: nisbah pengujaan reseptor gelombang panjang kepada gelombang pendek. Gelombang panjang dominan dibaca sebagai dedaun — turun dan hinggap; gelombang pendek dominan dibaca sebagai langit — berlepas dan bersurai. Mengapa kuning menang, peraturan legap, kegagalan akibat warna pudar dan filem penghalang UV semuanya ialah akibat langsung daripada satu paksi itu. Empat mekanisme lain masing-masing menguasai wilayah sendiri: trips mempunyai saluran biru yang bebas (sebab campuran biru-hijau saling membatalkan); psilid bertindak balas terhadap kuning-tambah-UV lebih daripada kuning sahaja (penambahan, bukan penolakan); lampu malam tiada kaitan dengan nisbah warna — ia ialah tindak balas cahaya dorsal yang dirampas, sebab itulah setiap peraturan lampu berkaitan kedudukan dan jarak; cahaya merah dan pencahayaan yang mengambil kira perosak bergantung pada ambang sirkadian \'belum gelap\'; dan lalat buah langsung berada di luar penglihatan, bergantung pada bau.',
 soZh:'一句话收束：<b>比值统治黏板，例外统治其余。</b>判断任何一条建议能不能从一个工具搬到另一个工具，先问它属于哪套机理——这就是「先看它讲的是板还是灯」的机理版。',
 soEn:'The one-line summary: <b>the ratio rules the cards; the exceptions rule everything else.</b> Before moving any piece of advice from one tool to another, ask which mechanism it belongs to — this is the mechanism-level form of "check whether it is about a card or a lamp".', soMs:'Ringkasan satu baris: <b>nisbah menguasai papan; pengecualian menguasai yang lain.</b> Sebelum memindahkan sebarang nasihat dari satu alat ke alat lain, tanya mekanisme mana yang berkaitan dengannya — inilah bentuk peringkat mekanisme bagi "semak sama ada ia mengenai papan atau lampu".'
}
];

function renderMech(){
  var el = document.getElementById('v-mech');
  var h = '<p class="lede">'+(L('七条机理。看懂这几条，任何一张波长表你都能自己判断对错——包括本软件里的。',
      'Seven mechanisms. Understand these and you can judge any spectral table on your own — including this one.',
      'Tujuh mekanisme. Fahami semuanya dan anda boleh menilai sebarang jadual spektrum sendiri — termasuk jadual ini.'))+'</p>';
  for(var i=0;i<MECH.length;i++){
    var m = MECH[i];
    h += '<div class="card"><h3>'+t(m)+' '+badge(m.tier)+'</h3>'
      + '<p class="note">'+(L(m.bodyZh, m.bodyEn, m.bodyMs))+'</p>'
      + '<div class="hr"></div>'
      + '<p class="note"><b>'+(L('实际意义：', 'Why it matters: ', 'Mengapa ia penting: '))+'</b>'+(L(m.soZh, m.soEn, m.soMs))+'</p></div>';
  }
  el.innerHTML = h;
}

   (greenhouse and low-crop work) was done on vegetable systems.

  var h = '<p class="lede">'+(L('给菜农的默认配置。有一点值得先说：本软件引用的试验大多来自温室和矮秆作物——对菜园来说，这些证据是<b>本土的</b>，不像榴莲页那样需要外推。密度、高度、换板规则都可以直接照做。',
      'Defaults for vegetable growers. One thing worth saying first: most of the trials this app cites come from greenhouses and low-growing crops — for a vegetable farm this evidence is <b>native</b>, not extrapolated the way the durian page must. Densities, heights and replacement rules apply as written.',
      'Tetapan lalai untuk penanam sayur. Satu perkara wajar disebut dahulu: kebanyakan ujian yang dipetik aplikasi ini datang dari rumah hijau dan tanaman rendah — bagi ladang sayur, bukti ini <b>terus terpakai</b>, bukan diekstrapolasi seperti yang terpaksa dilakukan pada halaman durian. Kepadatan, ketinggian dan peraturan penggantian terpakai seperti yang tertulis.'))+'</p>';

  h += '<div class="card"><h3>'+(L('大田叶菜、瓜豆、辣椒', 'Open-field leafy greens, cucurbits, beans, chilli', 'Sayur daun ladang terbuka, labu-labuan, kacang, cili'))+' '+badge('field')+'</h3>'
    + '<ul class="tight">'
    + '<li>'+(L('<b>黄板，每 200 m² 一张（约每英亩 20 张）</b>，竖挂，板底与作物顶端齐平或略高。作物长高板跟着升——这条规则本来就是给矮作物写的。', '<b>Yellow cards, one per 200 m² (about 20 per acre)</b>, vertical, base level with or just above the crop top, raised as the crop grows — this rule was written for low crops in the first place.', '<b>Papan kuning, satu bagi setiap 200 m² (kira-kira 20 bagi setiap ekar)</b>, menegak, bahagian bawahnya separas atau sedikit di atas pucuk tanaman, dinaikkan apabila tanaman membesar — peraturan ini memang ditulis untuk tanaman rendah sejak awal.'))+'</li>'
    + '<li>'+(L('针对蚜虫、白粉虱、叶蝉、潜叶蝇：黄板通吃。选<b>不透明</b>的黄板——不透明黄板比半透明的多捕 1.5–7 倍。', 'For aphids, whiteflies, hoppers and leafminers one yellow card covers all. Choose <b>opaque</b> yellow — opaque out-caught translucent 1.5–7×.', 'Bagi afid, lalat putih, bena dan pengorek daun, satu papan kuning meliputi semuanya. Pilih kuning <b>legap</b> — kuning legap menangkap 1.5–7× lebih banyak berbanding kuning lut cahaya.'))+'</li>'
    + '<li>'+(L('辣椒、茄子、瓜类的<b>花期蓟马（西花蓟马属）用蓝板</b>，与花同高。蓝板黏蓟马是黄板的约 5 倍，且少黏天敌。', 'For <b>flower thrips (Frankliniella) on chilli, brinjal and cucurbits use blue</b>, at flower height. Blue takes about 5× the thrips of yellow, with less bycatch.', 'Bagi <b>trips bunga (Frankliniella) pada cili, terung dan labu-labuan, gunakan biru</b>, di paras bunga. Biru menangkap kira-kira 5× lebih banyak trips berbanding kuning, dengan tangkapan sampingan yang lebih sedikit.'))+'</li>'
    + '<li>'+(L('白粉虱压力大的作物（茄子、瓜类、番茄）：把密度加密到<b>每 90 m² 一张</b>。', 'On whitefly-prone crops (brinjal, cucurbits, tomato) tighten to <b>one card per 90 m²</b>.', 'Pada tanaman yang mudah diserang lalat putih (terung, labu-labuan, tomato), ketatkan kepada <b>satu papan bagi setiap 90 m²</b>.'))+'</li>'
    + '</ul>'
    + '<p class="note sub">'+(L('菜园比果园更需要早知道，原因是<b>病毒</b>：蚜虫、白粉虱、蓟马在菜上的主要危害往往是传毒，等看见虫害症状时毒已经进田了。板上最先出现的那几只，就是打药窗口的信号。',
      'A vegetable farm needs the early warning more than an orchard does, because of <b>viruses</b>: on vegetables the main damage from aphids, whiteflies and thrips is often the diseases they carry, and by the time feeding symptoms show, the virus is already in the field. The first few on a card are the signal that the treatment window has opened.',
      'Ladang sayur lebih memerlukan amaran awal berbanding dusun, kerana <b>virus</b>: pada sayur, kerosakan utama daripada afid, lalat putih dan trips selalunya ialah penyakit yang dibawanya, dan apabila simptom kesan makan kelihatan, virus sudah pun berada di ladang. Beberapa ekor pertama pada papan ialah isyarat bahawa tempoh rawatan telah bermula.'))+'</p></div>';

  h += '<div class="card"><h3>'+(L('育苗棚与温室', 'Nurseries and protected structures', 'Tapak semaian dan struktur terlindung'))+' '+badge('field')+'</h3>'
    + '<ul class="tight">'
    + '<li>'+(L('<b>滤紫外薄膜或防虫网</b>是这里最硬的一招：紫外是蚜虫、白粉虱、蓟马起飞和迁入的信号，把紫外滤掉能明显压低迁入量。露地做不到，棚里做得到。', '<b>UV-blocking film or netting</b> is the strongest tool here: UV is the take-off and immigration cue for aphids, whiteflies and thrips, and cutting it measurably reduces what comes in. Impossible in the open field, possible under cover.', '<b>Filem atau jaring penghalang UV</b> ialah alat paling berkesan di sini: UV ialah isyarat untuk berlepas terbang dan berhijrah masuk bagi afid, lalat putih dan trips, dan menyekatnya mengurangkan kemasukan serangga secara terukur. Mustahil di ladang terbuka, tetapi boleh dilakukan di bawah bumbung.'))+'</li>'
    + '<li>'+(L('育苗盘上的真菌蚊：黄板<b>平放</b>在基质面，每 2 m² 一张。竖挂对它基本无效。', 'Fungus gnats over trays: yellow cards <b>flat</b> on the media, one per 2 m². Hanging them does little.', 'Agas kulat di atas dulang: papan kuning diletakkan <b>mendatar</b> di atas media, satu bagi setiap 2 m². Menggantungnya hampir tidak berkesan.'))+'</li>'
    + '<li>'+(L('<b>诱杀（每 2–5 m² 一张）的证据就来自温室</b>：封闭空间、虫源有限，铺满热点才压得出效果。这一招搬到露地会大打折扣。', '<b>Mass trapping (one per 2–5 m²) is a greenhouse result</b>: a closed space with a finite population is where saturation works. It transfers poorly to the open field.', '<b>Pemerangkapan besar-besaran (satu bagi setiap 2–5 m²) ialah hasil kajian rumah hijau</b>: ruang tertutup dengan populasi terhad ialah tempat pemerangkapan secara tepu berkesan. Ia kurang sesuai dipindahkan ke ladang terbuka.'))+'</li>'
    + '</ul></div>';

  h += '<div class="card"><h3>'+(L('瓜实蝇：别买错诱剂', 'Melon fly: do not buy the wrong lure', 'Lalat tembikai: jangan beli umpan yang salah'))+' '+badge('field')+'</h3>'
    + '<p class="note">'+(L('瓜类上蛀果的是<b>瓜实蝇（Zeugodacus cucurbitae）</b>，和榴莲、木瓜上那类果实蝇不是同一种。关键差别：<b>它不认甲基丁香油</b>。瓜实蝇的雄虫诱剂是<b>诱蝇酮（cue-lure）</b>——买瓶装诱剂时看清成分，买错了挂一季也是空的。',
      'The borer in cucurbits is the <b>melon fly (Zeugodacus cucurbitae)</b> — not the same fly as on durian or papaya. The difference that costs money: <b>it does not respond to methyl eugenol.</b> The male lure for melon fly is <b>cue-lure</b> — read the label before buying, because the wrong bottle hangs empty all season.',
      'Pengorek pada labu-labuan ialah <b>lalat tembikai (Zeugodacus cucurbitae)</b> — bukan lalat yang sama seperti pada durian atau betik. Perbezaan yang merugikan wang: <b>ia tidak bertindak balas terhadap metil eugenol.</b> Umpan jantan untuk lalat tembikai ialah <b>cue-lure</b> — baca label sebelum membeli, kerana botol yang salah akan tergantung kosong sepanjang musim.'))+'</p>'
    + '<p class="note sub">'+(L('两类通用的手段：蛋白饵剂对雌雄都有效；苦瓜、黄瓜、丝瓜<b>套袋</b>本来就是本地常规做法，对瓜实蝇也最直接。颜色在这里同样不是主线索。',
      'What works across both flies: protein bait takes females as well as males, and <b>bagging</b> bitter gourd, cucumber and loofah — already routine local practice — is the most direct defence. Colour, here as with the durian fly, is not the main cue.',
      'Apa yang berkesan untuk kedua-dua jenis lalat: umpan protein menangkap betina serta jantan, dan <b>membalut buah</b> peria, timun dan petola — sudah menjadi amalan biasa tempatan — ialah pertahanan paling langsung. Warna, di sini sama seperti lalat durian, bukan isyarat utama.'))+'</p></div>'
    + '<div class="card"><h3>'+(L('小菜蛾：灯和板都不是主力', 'Diamondback moth: neither lamp nor card is the tool', 'Rama-rama belakang intan: bukan lampu, bukan papan'))+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(L('芥蓝、包菜、小白菜上最难缠的小菜蛾要说清楚：黏板黏到的很少，灯诱证据也薄弱——不要为它买灯。真正的杠杆是轮作断粮、苏云金杆菌（Bt）、保护寄生蜂，以及性信息素诱捕器（那是气味，不是光）。本软件的范围是视觉与趋光，小菜蛾恰好主要不在这个范围里。',
      'For diamondback moth on kai lan, cabbage and pak choi, the honest statement is: cards take few, the lamp evidence is thin — do not buy a lamp for it. The working levers are rotation, Bt, protecting its parasitoids, and pheromone traps (an odour tool, not a visual one). This app covers vision and phototaxis, and DBM largely sits outside that scope.',
      'Bagi rama-rama belakang intan (DBM) pada kailan, kubis dan pak choy, kenyataan yang jujur ialah: papan menangkap sedikit, bukti lampu lemah — jangan beli lampu untuknya. Langkah yang berkesan ialah giliran tanaman, Bt, melindungi parasitoidnya, dan perangkap feromon (alat bau, bukan alat visual). Aplikasi ini merangkumi penglihatan dan fototaksis, dan DBM sebahagian besarnya berada di luar skop itu.'))+'</p></div>'
    + '<div class="card"><h3>'+(L('夜蛾与灯', 'Night moths and lamps', 'Rama-rama malam dan lampu'))+' '+badge('field')+'</h3>'
    + '<p class="note">'+(L('斜纹夜蛾、甜菜夜蛾这类夜蛾适用「夜蛾·蛀果蛾」的灯诱规则：UV-A 365–400 nm，傍晚到十点，装在虫来的那一边。菜地通常没有传粉禁区的问题，但灯照着的那几行菜同样会引来产卵——灯别正对着最要保护的畦。',
      'Armyworms and similar noctuids follow the same lamp rules as the moths-and-borers target: UV-A 365–400 nm, dusk to ten, sited on the side the moths come from. A vegetable plot rarely has the pollination constraint, but rows lit by the lamp still draw egg-laying — do not point it at the beds you most need to protect.',
      'Ulat ratus dan noktuid yang serupa mengikut peraturan lampu yang sama seperti sasaran rama-rama dan pengorek: UV-A 365–400 nm, senja hingga pukul sepuluh, diletakkan di sebelah arah datangnya rama-rama. Plot sayur jarang ada kekangan pendebungaan, tetapi barisan yang diterangi lampu tetap menarik rama-rama untuk bertelur — jangan halakan lampu ke batas yang paling perlu anda lindungi.'))+'</p></div>';

  h += '<div class="card"><h3>'+(L('菜园的天敌代价', 'The bycatch cost on a vegetable farm', 'Kos tangkapan sampingan di ladang sayur'))+' '+badge('field')+'</h3>'
    + '<p class="note">'+(L('本软件引用的益虫数据本来就是豆田量的：黄板黏到的天敌是蓝板的 1.7 倍，其中瓢虫 63%、小花蝽 29%。开花的菜（豆、瓜、茄果）边上尤其明显。所以默认监测密度，诱杀只铺热点；潜叶蝇一律不要诱杀——它的寄生蜂比板更能压住它。',
      'The beneficial-bycatch figures this app cites were measured on a bean field: yellow takes 1.7× the natural enemies of blue, 63% of them ladybirds and 29% Orius. It shows most beside flowering vegetables. So default to monitoring density, saturate hotspots only — and never mass-trap leafminers, whose parasitoids suppress them better than any card.',
      'Angka tangkapan sampingan serangga berfaedah yang dipetik aplikasi ini diukur di ladang kacang: kuning menangkap 1.7× lebih banyak musuh semula jadi berbanding biru, 63% daripadanya kumbang kura-kura dan 29% Orius. Kesannya paling ketara di sebelah sayur yang sedang berbunga. Jadi gunakan kepadatan pemantauan sebagai lalai, lakukan pemerangkapan tepu di kawasan serangan tinggi sahaja — dan jangan sekali-kali memerangkap pengorek daun secara besar-besaran, kerana parasitoidnya mengawalnya lebih baik daripada mana-mana papan.'))+'</p></div>';

  h += '<div class="card"><h3>'+(L('换板与认板', 'Replacement', 'Penggantian'))+'</h3>'
    + '<p class="note">'+(L('换板规则与「换板」页完全相同：覆盖 20–30% 或每周，先到为准；按最密的那一片判断。菜园虫量大，板满得比果园快，旺季常常等不到一周。',
      'Replacement is exactly as on the When-to-replace tab: 20–30% cover or weekly, whichever first, judged by the densest patch. Vegetable farms load cards faster than orchards — in season a card often does not last the week.',
      'Penggantian adalah sama seperti di tab Bila ganti: 20–30% litupan atau setiap minggu, mana yang lebih awal, dinilai berdasarkan bahagian yang paling padat. Ladang sayur memenuhkan papan lebih cepat berbanding dusun — pada musimnya, papan selalunya tidak bertahan seminggu.'))+'</p></div>';

  el.innerHTML = h;
}

 {url:'https://agris.fao.org/agris-search/search.do?recordID=TH2005001673', a:'Chanthaburi bagging trial (2001–2002)', t:'IPM for durian seed borer on export durian: bagging at 6 weeks after fruit set gave 0% infestation vs 5.44% in the control, verified by cutting open all 3,645 experimental fruits.', kind:'paper', n:{zh:'套袋数据的出处：坐果后 6 周套袋 0% 蛀果、对照 5.44%，全部 3,645 个试验果剖开验证。',en:'Source for the bagging figures: 0% vs 5.44%, all 3,645 fruits cut open and checked.', ms:'Sumber angka pembungkusan buah: 0% berbanding 5.44%, kesemua 3,645 biji buah dibelah dan diperiksa.'}},
 {url:'https://calag.ucanr.edu/Archive/?article=ca.v070n01p32', a:'Trap saturation study (California Agriculture, 2016)', t:'Sticky traps saturate with navel orangeworm in a nonlinear fashion.', kind:'paper', n:{zh:'捕获效率随虫体与鳞片在胶面堆积而下降，每板 50 只以下即已非线性衰减。本软件把换板门槛定在低档的依据。',en:'Capture efficiency falls as bodies and scales accumulate on the glue, with the decline already nonlinear below 50 moths per trap. The basis for setting the replacement threshold at the low end.', ms:'Kecekapan tangkapan menurun apabila badan dan sisik terkumpul pada gam, dengan penurunan sudah tidak linear di bawah 50 ekor rama-rama setiap perangkap. Ini asas untuk menetapkan ambang penggantian pada tahap rendah.'}},
 {url:'https://content.ces.ncsu.edu/insects-found-on-yellow-sticky-traps-in-the-greenhouse', a:'NC State Extension', t:'Insects found on yellow sticky traps in the greenhouse. Entomology Insect Note.', kind:'practice', n:{zh:'板上认虫的主要依据。明确记载白粉虱一沾胶就掉蜡粉、露出橙色本体，「几乎化掉」；也给出蚜虫腹管、真菌蚊 Y 形翅脉、寄生蜂肘状触角等特征。',en:'The main source for the card characters. States explicitly that whiteflies lose their bloom in the adhesive, show their true orange colour and "almost dissolve"; also gives aphid cornicles, the fungus gnat Y-vein, and parasitoid elbowed antennae.', ms:'Sumber utama bagi ciri pengecaman pada papan. Menyatakan dengan jelas bahawa lalat putih kehilangan lapisan lilinnya dalam gam, menunjukkan warna oren sebenar dan "hampir larut"; juga memberikan kornikel afid, urat-Y agas kulat, dan antena bersiku parasitoid.'}},
 {url:'https://ipm.cahnr.uconn.edu/wp-content/uploads/sites/3216/2022/12/2019ticky-Card-PhotosIPM2-1-1.pdf', a:'Pundt — UConn Extension IPM', t:'Identifying some pest and beneficial insects on your sticky cards.', kind:'practice', n:{zh:'蚜虫腹管与产仔、10–20 倍放大镜、头戴放大镜扫全板、真菌蚊平放更有效。',en:'Aphid cornicles and nymphs, the 10–20× lens requirement, a head-worn visor for scanning a whole card, and horizontal placement for fungus gnats.', ms:'Kornikel dan nimfa afid, keperluan kanta 10–20×, visor yang dipakai di kepala untuk mengimbas seluruh papan, dan peletakan mendatar untuk agas kulat.'}},
 {url:'https://extension.okstate.edu/fact-sheets/ipm-scouting-and-monitoring-for-pests-in-commercial-greenhouses', a:'Oklahoma State Extension; UF/IFAS greenhouse handbook', t:'IPM scouting and monitoring in commercial greenhouses; vegetable insect identification.', kind:'practice', n:{zh:'板上特征的第二来源，并给出固定位置、编号、每周（或每三天）计数的做法。',en:'A second source for the card characters, plus the practice of fixed numbered positions counted weekly, or every three days.', ms:'Sumber kedua bagi ciri pengecaman pada papan, serta amalan kedudukan bernombor tetap yang dikira setiap minggu, atau setiap tiga hari.'}},
 {a:'e-GRO / UConn (2023)', t:'A sticky subject: yellow sticky cards. e-GRO Alert vol. 12 no. 32, August 2023.', kind:'practice', n:{zh:'每周换板；黏板只抓有翅成虫，若虫、螨、介壳虫仍须上树检查。',en:'Change cards weekly; cards trap only winged adults, so nymphs, mites and scale still require plant inspection.', ms:'Tukar papan setiap minggu; papan hanya memerangkap dewasa bersayap, jadi nimfa, hama dan serangga bersisik masih memerlukan pemeriksaan pokok.'}},
 {url:'https://ipm.ucanr.edu/agriculture/floriculture-and-ornamental-nurseries/monitoring-with-sticky-traps/', a:'UC IPM — Monitoring with sticky traps', t:'Floriculture and Ornamental Nurseries, Pest Management Guidelines.', kind:'practice', n:{zh:'基础监测量：每 10,000 平方英尺（约 900 m²）至少一张；粉虱敏感作物加密到每 1,000 平方英尺（约 90 m²）一张。每个管理单元至少要有一张。',en:'Baseline monitoring: at least one trap per 10,000 sq ft (about 900 m²), tightened to one per 1,000 sq ft (about 90 m²) on whitefly-susceptible crops. Every management unit needs at least one.', ms:'Pemantauan asas: sekurang-kurangnya satu perangkap bagi setiap 10,000 kaki persegi (kira-kira 900 m²), diketatkan kepada satu bagi setiap 1,000 kaki persegi (kira-kira 90 m²) pada tanaman yang mudah diserang lalat putih. Setiap unit pengurusan memerlukan sekurang-kurangnya satu.'}},
 {url:'https://international-pest-control.com/wordpress/monitoring-and-trapping-with-sticky-traps-whats-new/', a:'Sampson — Monitoring and trapping with sticky traps', t:'International Pest Control, review of current trap deployment practice.', kind:'practice', n:{zh:'常规做法：垂直挂在冠层稍上方，每 200 m² 一张（约每英亩 20 张），随作物长高上移。诱杀：热点每 2 m² 一张；Lu 等（2012）在温室茄子上每 5 m² 一张即显著压低烟粉虱。',en:'Standard practice: vertical, just above the canopy, about one trap per 200 m² (roughly 20 per acre), raised as the crop grows. Mass trapping: one per 2 m² in hotspots; Lu et al. (2012) achieved a significant Bemisia reduction at one per 5 m² in glasshouse aubergine.', ms:'Amalan standard: menegak, sedikit di atas kanopi, kira-kira satu perangkap bagi setiap 200 m² (kira-kira 20 seekar), dinaikkan apabila tanaman membesar. Perangkapan besar-besaran: satu bagi setiap 2 m² di kawasan tumpuan serangan; Lu et al. (2012) mencapai pengurangan Bemisia yang signifikan pada satu bagi setiap 5 m² dalam terung rumah kaca.'}},
 {a:'Penang mango thrips monitoring study', t:'Yellow sticky trap estimates of thrips populations in a Malaysian mango orchard, dry and wet seasons 2008–2009.', kind:'paper', n:{zh:'黄板计数与花穗上的实际蓟马数量相关，捕获量随离园距离下降。马来西亚果园的本地验证。',en:'Yellow-trap counts correlated with actual thrips numbers on mango panicles, and catch fell with distance from the orchard. A Malaysian orchard validation.', ms:'Kiraan perangkap kuning berkorelasi dengan bilangan sebenar trips pada jambak bunga mangga, dan tangkapan menurun dengan jarak dari dusun. Satu pengesahan di dusun Malaysia.'}},
 {url:'https://www.umass.edu/agriculture-food-environment/greenhouse-floriculture/fact-sheets/fungus-gnats-shore-flies', a:'UMass Extension; Clemson Land-Grant Press', t:'Fungus gnats and shore flies — greenhouse fact sheets; IPM strategies for fungus gnats in ornamental propagation.', kind:'practice', n:{zh:'放法一致：黄板平放在基质表面或略高处，每 1,000 平方英尺 1–4 张，每周查。颜色一项转述康奈尔的结论：红板捕获量高于黄板。',en:'Consistent on placement: lay yellow cards flat on or just above the media, 1–4 per 1,000 sq ft, checked weekly. On colour they relay the Cornell result that red cards out-caught yellow.', ms:'Konsisten tentang peletakan: letakkan papan kuning secara rata di atas atau sedikit di atas media, 1–4 bagi setiap 1,000 kaki persegi, diperiksa setiap minggu. Tentang warna, mereka memetik hasil Cornell bahawa papan merah menangkap lebih banyak daripada kuning.'}},
 {a:'Conflicting reports on red vs yellow for fungus gnats', t:'Cornell (relayed by UMass) reports red out-catching yellow; a result attributed to Ohio State reports yellow beating blue, white, green and red.', kind:'note', n:{zh:'两边都只见到推广机构的转述，未见原始试验，方向相反。本软件按未定处理，默认仍用黄板——它买得到，且对其他害虫通用。',en:'Both reach me only as extension summaries, never the primary trials, and they point opposite ways. Treated as unsettled here; yellow remains the default because it is available and works on the other pests too.', ms:'Kedua-duanya hanya sampai kepada saya sebagai ringkasan pengembangan, bukan ujian asal, dan kedua-duanya menunjuk ke arah bertentangan. Dianggap belum muktamad di sini; kuning kekal sebagai pilihan lalai kerana mudah didapati dan berkesan juga terhadap perosak lain.'}},
 {a:'AQIS durian import risk analysis', t:'Final import risk analysis on the importation of fresh durian fruit.', kind:'official', n:{zh:'榴莲木虱 Allocarsidara malayensis 危害叶片不危害果实；Scirtothrips dorsalis 是榴莲花期害虫；果实蝇 Bactrocera 属的甲基丁香油为雄性专一引诱剂。',en:'Durian psyllid Allocarsidara malayensis attacks foliage not fruit; Scirtothrips dorsalis is a durian flower pest; methyl eugenol is a male-specific lure for Bactrocera fruit flies.', ms:'Psilid durian Allocarsidara malayensis menyerang dedaun, bukan buah; Scirtothrips dorsalis ialah perosak bunga durian; metil eugenol ialah pemikat khusus jantan bagi lalat buah Bactrocera.'}}
];

    + '</div><div class="sharetxt">'
    + '<p class="note">'+(L('扫码打开在线版。第一次打开后就能离线使用；在浏览器菜单选「安装」或「加到主屏幕」，它会像普通软件一样出现在桌面上。',
      'Scan to open the online copy. After the first load it works offline; choose Install or Add to Home Screen in the browser menu and it sits on the home screen like any other app.',
      'Imbas untuk membuka salinan dalam talian. Selepas pemuatan pertama, ia berfungsi di luar talian; pilih Pasang atau Tambah ke Skrin Utama dalam menu pelayar dan ia akan berada di skrin utama seperti aplikasi lain.'))+'</p>'
    + '<p class="note sub" style="word-break:break-all">stanleywoosweeleong.github.io/insecteye/</p>'
    + '</div></div></div>'
    + '<p class="lede">'+(L('本软件里的每一条内容都能追到下面某一项，追不到的没有写进来。<b>蓝色的条目可以点开原文</b>；其余的没有稳定链接，只能按标题检索。另外注意：下面既有同行评审的论文，也有推广机构的实务指引——后者通常不标年份，可靠性也不同，正文里的证据等级已经区分过。',
      'Every line in this app traces to one of the entries below; what could not be traced was left out. <b>Entries in blue open the source</b>; the rest have no stable link and must be searched by title. Note also that the list mixes peer-reviewed papers with extension practice guidance — the latter often carries no year and is not the same kind of evidence, which is what the tiers in the body text distinguish.',
      'Setiap baris dalam aplikasi ini boleh dikesan kepada salah satu entri di bawah; apa yang tidak dapat dikesan telah ditinggalkan. <b>Entri berwarna biru membuka sumbernya</b>; selebihnya tiada pautan stabil dan perlu dicari menggunakan tajuk. Perhatikan juga bahawa senarai ini mencampurkan kertas kajian yang disemak rakan sebaya dengan panduan amalan pengembangan — yang kedua selalunya tiada tahun dan bukan jenis bukti yang sama, dan inilah yang dibezakan oleh peringkat bukti dalam teks utama.'))+'</p><div class="card">';
  for(var i=0;i<REFS.length;i++){
    var r = REFS[i];
    var head = r.url
      ? '<a href="'+r.url+'" target="_blank" rel="noopener"><b>'+r.a+'</b></a>'
      : '<b>'+r.a+'</b>';
    var kd = REF_KIND[r.kind] || REF_KIND.paper;
    var locatable = r.url || /\d{4}/.test(r.a+r.t);
    h += '<div class="ref"><span class="refkind rk-'+r.kind+'">'+t(kd)+'</span>'
       + (locatable ? '' : '<span class="refkind rk-nofix">'+(L('无年份／无链接', 'no year or link', 'tiada tahun atau pautan'))+'</span>')

  }
  h += '</div><div class="card"><h3>'+(L('关于证据等级', 'On the evidence tiers', 'Tentang peringkat bukti'))+'</h3>'
    + '<p class="note">'+(L('<b>实测</b>：电生理或光谱测量，直接测的是受体本身。<b>田间试验</b>：田间或选择试验，测的是昆虫的行为——同一种虫在不同作物、不同季节可能给出不同结果。<b>机理推断</b>：从已发表机制推出来、但对这一类群没有直接测过，这一级最应该在自己园里验证。',
      '<b>Measured</b>: electrophysiology or spectral measurement, taken from the receptor itself. <b>Field trial</b>: field or choice tests, measuring behaviour — the same species can give different results on a different crop or in a different season. <b>Mechanism</b>: inferred from a published mechanism but not directly measured for that group, and the tier most worth verifying in your own block.',
      '<b>Diukur</b>: elektrofisiologi atau pengukuran spektrum, diambil daripada reseptor itu sendiri. <b>Ujian ladang</b>: ujian ladang atau ujian pilihan, mengukur tingkah laku — spesies yang sama boleh memberi keputusan berbeza pada tanaman lain atau dalam musim lain. <b>Mekanisme</b>: disimpulkan daripada mekanisme yang diterbitkan tetapi tidak diukur secara langsung untuk kumpulan itu, dan peringkat yang paling wajar disahkan di blok anda sendiri.'))
    +'</p></div>';
  el.innerHTML = h;
}

var VIEWS = ['spectrum','mech','species','cardid','advisor','durian','veg','refs'];
var curView = 'spectrum';

function renderNav(){
  var n = document.getElementById('nav'), h='';
  for(var i=0;i<VIEWS.length;i++){
    h += '<button data-v="'+VIEWS[i]+'"'+(curView===VIEWS[i]?' class="on"':'')+'>'+t(T.nav[VIEWS[i]])+'</button>';
  }
  n.innerHTML = h;
  n.querySelectorAll('[data-v]').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-v')); });
  });
}
function show(v){
  curView = v;
  for(var i=0;i<VIEWS.length;i++){
    document.getElementById('v-'+VIEWS[i]).classList.toggle('on', VIEWS[i]===v);
  }
  renderNav();
  window.scrollTo(0,0);
}
function renderAll(){
  document.getElementById('bTitle').textContent = L('虫眼光谱', 'InsectEye', 'InsectEye');
  document.getElementById('bSub').textContent = L('昆虫视觉与趋光实验室', 'Entomology vision & phototaxis lab', 'Makmal penglihatan & fototaksis entomologi');
  document.getElementById('langbtn').textContent = L('中文', 'EN', 'BM');
  document.documentElement.lang = L('zh', 'en', 'ms');
  document.title = document.getElementById('bTitle').textContent+' · '+document.getElementById('bSub').textContent;
  applyFs();
  document.getElementById('foot').innerHTML = (L('这里的数字是起点，按你园里的捕获量调整。<br>'+CACHE_VERSION,
      'The figures here are starting points — adjust them to what your own catch shows.<br>'+CACHE_VERSION,
      'Angka di sini hanyalah titik permulaan — laraskan mengikut hasil tangkapan di kebun anda sendiri.<br>'+CACHE_VERSION));
  renderNav();
  renderSpectrum(); renderMech(); renderSpecies(); renderCoverage(); renderAdvisor();
  renderDurian(); renderVeg(); renderRefs();
  show(curView);
}

document.getElementById('fsbtn').addEventListener('click', function(){
  FS = FS_STEPS[(FS_STEPS.indexOf(FS)+1) % FS_STEPS.length];
  try{ localStorage.setItem('insecteye.fs', FS); }catch(e){}
  applyFs();
});

document.getElementById('langbtn').addEventListener('click', function(){
  LANG = LANGS[(LANGS.indexOf(LANG)+1) % LANGS.length];
  try{ localStorage.setItem('insecteye.lang', LANG); }catch(e){}
  renderAll();
});

try{
  var saved = localStorage.getItem('insecteye.lang');
  if(LANGS.indexOf(saved) > -1) LANG = saved;
  var fsSaved = localStorage.getItem('insecteye.fs');
  if(FS_STEPS.indexOf(fsSaved) > -1) FS = fsSaved;
}catch(e){}

renderAll();

/* PWA: register only over http(s) — file:// testing stays untouched. The
   version in the query string means a CACHE_VERSION bump re-registers the
   worker and rolls the cache without ever editing sw.js. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js?v='+CACHE_VERSION).catch(function(){});
  });
}
