<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1119">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="虫眼光谱">
<title>虫眼光谱 · 昆虫视觉与趋光实验室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1119'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23b98cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f2d64b'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0d1017;
  --ink2:#181e2c;
  --ink3:#222a3a;
  --line:#39435c;
  --bone:#f5f3ed;
  --mute:#c9d1e3;
  --uv:#b083ff;
  --blu:#6fa3ff;
  --grn:#5ad79c;
  --yel:#f7cf52;
  --org:#f79a4e;
  --red:#f0716a;
  --ok:#5ad79c;
  --warn:#f7cf52;
  --bad:#f0716a;
  --radius:12px;
}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.fs-l{font-size:20.5px}
html.fs-xl{font-size:23px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:1rem;line-height:1.72;font-weight:450;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:Georgia,"Songti SC","Noto Serif CJK SC","Times New Roman",serif;font-weight:700;line-height:1.3;margin:0}
a{color:var(--blu)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(13,16,23,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
}
.brandrow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:nowrap}
.brandrow h1{font-size:1.55rem;letter-spacing:.5px;line-height:1.2;min-width:0}
header #bSub{margin:3px 0 0;font-size:0.9rem;color:var(--mute);font-weight:500;line-height:1.3}
.ctrls{display:flex;gap:6px;flex:none;padding-bottom:2px}
.ctrls #fsbtn{display:flex;align-items:baseline;gap:3px;padding:6px 15px 7px;line-height:1}
.ctrls #fsbtn .fsref{font-size:.72em;opacity:.5;font-weight:700}
.ctrls #fsbtn .fscur{font-weight:700;transition:font-size .12s ease}
#fsbtn.fs-m .fscur{font-size:1em}
#fsbtn.fs-l .fscur{font-size:1.3em}
#fsbtn.fs-xl .fscur{font-size:1.62em}
.ctrls button{
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:0.96rem;font-weight:600;color:var(--bone);background:var(--ink2);
  white-space:nowrap;
}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0 12px}
nav button{
  min-height:44px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:6px 2px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink2);color:var(--mute);
  /* nav is chrome, not reading content: it sizes to the viewport, not to the
     Aa setting, so eight labels always fit without scrolling */
  font-size:clamp(11.5px, 3.05vw, 14.5px);font-weight:600;line-height:1.2;
  /* never split a word: a chip reading "Vegetable / s" looks broken */
  overflow-wrap:normal;word-break:keep-all;hyphens:none;
}
nav button.on{
  background:var(--yel);border-color:var(--yel);color:#0d1017;font-weight:700;
}
@media(min-width:620px){
  nav button{min-height:3rem;font-size:1rem}
}
main{padding:18px 14px 60px;max-width:760px;margin:0 auto}
section{display:none}
section.on{display:block}

/* ---------- generic ---------- */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:1.08rem;margin-bottom:8px}
.lede{color:var(--mute);font-size:0.94rem;font-weight:450;margin:0 0 16px}
.sub{color:var(--mute);font-size:0.88rem}
.hr{height:1px;background:var(--line);margin:14px 0}
ul.tight{margin:10px 0 0;padding-left:20px;font-size:0.94rem}
ul.tight li{margin-bottom:8px}
.kv{display:flex;gap:10px;font-size:0.9rem;padding:6px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 6.2em;color:var(--mute);font-weight:600}

/* evidence badges */
.ev{display:inline-block;font-size:0.88rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;vertical-align:middle;white-space:nowrap;line-height:1.6}
.ev-measured{color:#8bf0c1;border-color:#3a8564;background:#12291f}
.ev-field{color:#a3c4ff;border-color:#3f5888;background:#151c2c}
.ev-mech{color:#e2c9ff;border-color:#674592;background:#1e1729}
.ev-schem{color:var(--mute);border-color:var(--line);background:var(--ink3)}
.ev-wrong{color:#ffb0a8;border-color:#96443c;background:#2c1614}

/* ---------- spectrum scrubber ---------- */
.scrub{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.nmbig{font-family:Georgia,serif;font-size:2.9rem;font-weight:700;line-height:1;letter-spacing:-1px}
.nmbig small{font-size:1rem;color:var(--mute);letter-spacing:0;margin-left:5px;font-weight:600}
.bandname{margin-top:6px;min-height:4.05rem}
.bandname b{display:block;font-size:1.08rem;font-weight:700;color:var(--bone);line-height:1.35}
.bandname span{display:block;font-size:0.9rem;font-weight:500;color:var(--mute);line-height:1.4;
  margin-top:2px;min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{position:relative;height:30px;border-radius:6px;margin:16px 0 6px;overflow:hidden}
.bar .tick{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px #000}
input[type=range]{width:100%;margin:0;height:32px;accent-color:var(--yel)}
.axis{display:flex;justify-content:space-between;font-size:0.92rem;font-weight:600;color:var(--bone);margin-top:4px}

.rechead{display:flex;align-items:center;gap:8px;margin-top:18px;
  font-size:0.9rem;font-weight:600;color:var(--mute)}
#recCurves{display:block;width:100%;height:4rem;margin-top:8px;
  background:transparent;border-radius:8px;
  touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.bar{touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.rec{margin-top:10px}
.recrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.recrow span.nm{flex:0 0 8.8em;min-width:0}
.recrow span.nm b{display:block;font-size:1rem;font-weight:700;color:var(--bone);line-height:1.3}
.recrow span.nm i{display:block;font-style:normal;font-size:0.9rem;font-weight:500;color:var(--mute);line-height:1.3}
.recbar{flex:1;height:14px;background:var(--ink3);border-radius:7px;overflow:hidden}
.recbar i{display:block;height:100%;border-radius:7px;transition:width .12s linear}
.recrow em{flex:0 0 4.4em;text-align:right;font-size:0.94rem;font-style:normal;font-weight:700;color:var(--bone)}

.hitlist{margin-top:12px}
.hit{display:flex;align-items:baseline;gap:9px;padding:7px 0 7px 2px}
.hit .dots{flex:0 0 3.1em;letter-spacing:1px;font-size:1rem}
.hit .nmz{flex:1;font-size:0.94rem;font-weight:500}
.covgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.covcell{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ink2);
  padding:0;display:flex;flex-direction:column}
.covcell.on{border-color:var(--bone)}
.covsvg{display:block;width:100%;height:60px}
.covpc{padding:6px 0;font-size:0.92rem;font-weight:700;color:var(--mute)}
.covcell.on .covpc{color:var(--ink);background:var(--bone)}
.card.cov-ok{border-color:#3a8564}
.card.cov-warn{border-color:#7a6427}
.card.cov-bad{border-color:#96443c}
.mgroup{margin-top:14px}
.mgroup:first-child{margin-top:4px}
.mghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 0;border-top:1px solid var(--line)}
.mgname{font-size:0.98rem;font-weight:700;color:var(--bone)}
.mgcount{font-size:0.8rem;font-weight:700;color:var(--mute);background:var(--ink3);
  border-radius:999px;padding:1px 9px}
.chev{margin-left:auto;flex:none;display:flex;align-items:center;justify-content:center;
  width:1.9em;height:1.9em;border-radius:50%;border:1px solid var(--line);color:var(--mute);
  transition:transform .18s ease,color .18s ease}
.chev svg{width:.78em;height:.52em;overflow:visible}
.chev svg path{fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.mghead.open .chev,.sphead.open .chev{transform:rotate(180deg);color:var(--bone);border-color:var(--mute)}
.modenote{display:none;font-size:0.9rem;color:var(--mute);background:var(--ink3);
  border-radius:8px;padding:11px 13px;margin:2px 0 8px}
.modenote.open{display:block}
.empty{color:var(--mute);font-size:0.92rem;padding:16px 0;text-align:center}

/* ---------- species ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:0.88rem;font-weight:600;color:var(--mute);background:var(--ink2)}
.chip.on{color:#0d1017;background:var(--yel);border-color:var(--yel);font-weight:700}
.sp{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden}
.sp>button{width:100%;text-align:left;padding:14px;display:flex;align-items:center;gap:11px}
.sp .swatch{flex:none;width:9px;height:38px;border-radius:3px}
.sp .ttl{flex:1;min-width:0}
.sp .ttl b{display:block;font-size:1.02rem;font-weight:700}
.sp .ttl i{display:block;font-style:italic;font-size:0.88rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbody{display:none;padding:14px 14px 16px;border-top:1px solid var(--line)}
.sp.open .spbody{display:block}
.peaks{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.peak{font-size:0.88rem;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--ink3)}
.note{font-size:0.96rem;line-height:1.72;margin:10px 0 0}
.note b{color:var(--bone);font-weight:700}

/* ---------- advisor ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.opt{border:1px solid var(--line);background:var(--ink2);border-radius:10px;padding:13px;text-align:left;font-size:0.94rem;font-weight:500}
.opt.on{border-color:var(--yel);background:#2a2410;color:#fff;font-weight:700}
.opt small{display:block;color:var(--mute);font-size:0.88rem;font-weight:450;margin-top:3px}
.rx{border-left:4px solid var(--yel);padding-left:14px;margin-top:18px}
.rx h3{font-size:1.15rem}
.caution{background:#2a2410;border:1px solid #7a6427;border-radius:10px;padding:13px;font-size:0.92rem;margin-top:12px;color:#f8e9c2}
.caution b{color:#f9d97a;font-weight:700}

/* ---------- refs ---------- */
.ref{font-size:0.88rem;padding:11px 0;border-bottom:1px solid var(--line);color:var(--mute)}
.ref b{color:var(--bone);font-weight:700}
.ref a{color:var(--blu);text-decoration:none;border-bottom:1px solid rgba(111,163,255,.4)}
.sharecard{margin-bottom:14px}
.sharerow{display:flex;gap:14px;align-items:center}
.qrbox{flex:none;width:160px;height:160px;background:#fff;border-radius:10px;padding:12px}
.qrbox img{display:block;width:100%;height:100%;image-rendering:pixelated}
.sharetxt{min-width:0}
@media(max-width:359px){ .sharerow{flex-direction:column;align-items:flex-start} }
.refkind{display:inline-block;font-size:0.78rem;font-weight:700;padding:1px 8px;border-radius:999px;
  border:1px solid var(--line);margin:0 6px 4px 0}
.rk-paper{color:#8bf0c1;border-color:#3a8564}
.rk-preprint{color:#e2c9ff;border-color:#674592}
.rk-practice{color:#a3c4ff;border-color:#3f5888}
.rk-official{color:var(--mute)}
.rk-note{color:#f9d97a;border-color:#7a6427}
.rk-nofix{color:var(--mute);background:var(--ink3)}
footer{color:var(--mute);font-size:0.88rem;text-align:center;padding:26px 14px 44px;line-height:1.75}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:620px){ .kv b{flex-basis:9em} }
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <h1 id="bTitle">虫眼光谱</h1>
    <div class="ctrls">
      <button id="fsbtn" aria-label="Text size"><span class="fsref">A</span><span class="fscur">A</span></button>
      <button id="langbtn" aria-label="Language">中文</button>
    </div>
  </div>
  <p id="bSub">昆虫视觉与趋光实验室</p>
  <nav id="nav"></nav>
</header>

<main>
  <section id="v-spectrum" class="on"></section>
  <section id="v-mech"></section>
  <section id="v-species"></section>
  <section id="v-cardid"></section>
  <section id="v-advisor"></section>
  <section id="v-durian"></section>
  <section id="v-veg"></section>
  <section id="v-refs"></section>
</main>

<footer id="foot"></footer>

<script>
"use strict";
var CACHE_VERSION = 'insecteye-v4.1.0-20261113';
var LANG = 'zh';
var LANGS = ['zh','en','ms'];
/* Pick the string for the current language. Malay falls back to English
   wherever a Malay string is missing, so a new English line never shows blank. */
function L(zh, en, ms){
  if(LANG === 'zh') return zh;
  if(LANG === 'ms' && ms != null && ms !== '') return ms;
  return en;
}
var FS = 'm';
var FS_STEPS = ['m','l','xl'];
var FS_LABEL = {
  m:{zh:'字号 中',en:'Text M', ms:'Teks M'},
  l:{zh:'字号 大',en:'Text L', ms:'Teks L'},
  xl:{zh:'字号 特大',en:'Text XL', ms:'Teks XL'}
};
function applyFs(){
  var h = document.documentElement;
  h.classList.remove('fs-l','fs-xl');
  if(FS === 'l') h.classList.add('fs-l');
  if(FS === 'xl') h.classList.add('fs-xl');
  var b = document.getElementById('fsbtn');
  if(b){
    b.className = 'fs-'+FS;
    b.setAttribute('aria-label', L(FS_LABEL[FS].zh, FS_LABEL[FS].en, FS_LABEL[FS].ms));
  }
}

/* =========================================================
   Evidence tiers. Every substantive claim carries one.
   measured = published electrophysiology / spectral measurement
   field    = published field or choice-test trial
   mech     = inference from an accepted mechanism, not directly measured
   wrong    = contradicted by the primary literature
   ========================================================= */
var EV = {
  measured:{zh:'实测',en:'Measured', ms:'Diukur',cls:'ev-measured'},
  field:{zh:'田间试验',en:'Field trial', ms:'Ujian ladang',cls:'ev-field'},
  mech:{zh:'机理推断',en:'Mechanism', ms:'Mekanisme',cls:'ev-mech'},
  schematic:{zh:'示意，非实测',en:'Schematic, not measured', ms:'Skematik, bukan diukur',cls:'ev-schem'},
  wrong:{zh:'需修正',en:'Needs fixing', ms:'Perlu dibaiki',cls:'ev-wrong'}
};
function badge(tier){
  var e = EV[tier]; if(!e) return '';
  return '<span class="ev '+e.cls+'">'+(L(e.zh, e.en, e.ms))+'</span>';
}

var T = {
  nav:{
    spectrum:{zh:'光谱',en:'Spectrum', ms:'Spektrum'},
    mech:{zh:'机理',en:'How it works', ms:'Cara berfungsi'},
    species:{zh:'虫谱',en:'Insects', ms:'Serangga'},
    cardid:{zh:'换板',en:'When to replace', ms:'Bila ganti'},
    advisor:{zh:'选灯选板',en:'Pick a trap', ms:'Pilih perangkap'},
    durian:{zh:'榴莲园',en:'Durian', ms:'Durian'},
    veg:{zh:'菜园',en:'Vegetables', ms:'Sayuran'},
    refs:{zh:'资料来源',en:'Sources', ms:'Sumber'}
  }
};
function t(o){ return L(o.zh, o.en, o.ms); }

/* =========================================================
   Photoreceptor templates — SCHEMATIC, not measured spectra.
   Typical insect trichromat: UV ~350, blue ~440, green ~530.
   ========================================================= */
var RECEPTORS = [
  {id:'uv', max:350, sig:34, color:'#b083ff', zh:'紫外受体 UV', en:'UV receptor', ms:'Reseptor UV', nm:'~350 nm'},
  {id:'blue', max:440, sig:42, color:'#6fa3ff', zh:'蓝受体 Blue', en:'Blue receptor', ms:'Reseptor biru', nm:'~440 nm'},
  {id:'green', max:530, sig:58, color:'#5ad79c', zh:'绿受体 Green', en:'Green receptor', ms:'Reseptor hijau', nm:'~530 nm'}
];
function excite(nm, r){
  var d = (nm - r.max) / r.sig;
  var v = Math.exp(-0.5*d*d);
  if(nm > r.max) v += 0.10*Math.exp(-0.5*Math.pow((nm-r.max)/(r.sig*2.4),2));
  return Math.min(1, v);
}
/* Continuous wavelength -> sRGB across the visible range (Bruton's
   approximation, gamma 0.8), with an intensity floor so the band edges stay
   legible on a dark background. Below 380 nm there is no true colour — UV is
   invisible — so it is drawn as a deepening violet by convention. */
function wlRGB(nm){
  var r=0,g=0,b=0,f=1;
  if(nm < 380){
    /* UV is invisible: ramp a violet that meets the 380 nm value exactly,
       so the bar has no seam where physical colour begins. */
    var k = Math.max(0, Math.min(1, (nm-300)/80));
    return [Math.round(55+104*k), Math.round(18-18*k), Math.round(95+64*k)];
  }
  if(nm<440){ r=-(nm-440)/60; g=0; b=1; }
  else if(nm<490){ r=0; g=(nm-440)/50; b=1; }
  else if(nm<510){ r=0; g=1; b=-(nm-510)/20; }
  else if(nm<580){ r=(nm-510)/70; g=1; b=0; }
  else if(nm<645){ r=1; g=-(nm-645)/65; b=0; }
  else { r=1; g=0; b=0; }
  if(nm<420) f = 0.55 + 0.45*(nm-380)/40;
  else if(nm>700) f = 0.30 + 0.70*(780-nm)/80;
  if(f<0.30) f = 0.30;
  function ch(v){ return Math.round(255*Math.pow(Math.max(0,v)*f, 0.8)); }
  return [ch(r),ch(g),ch(b)];
}
function nmToCss(nm){
  var c = wlRGB(nm);
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
/* Same hue, lifted for use as text on the dark background. */
function nmToText(nm){
  var c = wlRGB(nm), m = Math.max(c[0],c[1],c[2]);
  var k = m < 170 ? 170/Math.max(m,1) : 1;
  return 'rgb('+Math.min(255,Math.round(c[0]*k))+','+Math.min(255,Math.round(c[1]*k))+','+Math.min(255,Math.round(c[2]*k))+')';
}
/* A gradient sampled across a band, so the middle of the band is shown too. */
function bandGradient(lo,hi,deg){
  var stops=[], steps=8;
  for(var i=0;i<=steps;i++){
    var nm = lo + (hi-lo)*i/steps;
    stops.push(nmToCss(nm)+' '+Math.round(i/steps*100)+'%');
  }
  return 'linear-gradient('+(deg||180)+'deg,'+stops.join(',')+')';
}

var BANDS = [
  {lo:100,hi:280,zh:'UV-C',en:'UV-C', ms:'UV-C',
   noteZh:'被大气吸收，地表几乎没有',noteEn:'absorbed by the atmosphere', noteMs:'diserap oleh atmosfera'},
  {lo:280,hi:315,zh:'UV-B',en:'UV-B', ms:'UV-B',noteZh:'',noteEn:'', noteMs:''},
  {lo:315,hi:400,zh:'UV-A',en:'UV-A', ms:'UV-A',
   noteZh:'黑光灯与诱虫灯的主力波段',noteEn:'the black-light trap band', noteMs:'jalur perangkap lampu hitam'},
  {lo:400,hi:420,zh:'紫光',en:'Violet', ms:'Ungu',noteZh:'',noteEn:'', noteMs:''},
  {lo:420,hi:480,zh:'蓝光',en:'Blue', ms:'Biru',

function chevron(){

function bestBand(sp){
  var b = null;
  for(var i=0;i<sp.resp.length;i++){
    if(!b || sp.resp[i].level > b.level) b = sp.resp[i];
  }
  return b;
}
function swatchStyle(sp){
  var b = bestBand(sp);
  if(!b) return 'background:#4d566e';
  return 'background:'+bandGradient(b.lo,b.hi,180);
}
function bandText(sp){
  var b = bestBand(sp);
  if(!b) return L('无可引用的颜色反应数据', 'no citable colour-response data', 'tiada data tindak balas warna yang boleh dirujuk');
  return b.lo+'–'+b.hi+' nm · '+modeLabel(b.mode);
}

function bandOf(nm){
  for(var i=0;i<BANDS.length;i++) if(nm>=BANDS[i].lo && nm<BANDS[i].hi) return BANDS[i];
  return BANDS[BANDS.length-1];
}

      'Sesuatu panjang gelombang boleh sampai kepada serangga melalui dua laluan yang agak berbeza: menerangi <b>permukaan berwarna</b> pada waktu siang (perangkap melekit), atau bertindak sebagai <b>sumber cahaya</b> yang lebih terang daripada latar belakang pada waktu malam (lampu perangkap). Panjang gelombang yang sama boleh memberi kesan yang bertentangan pada kedua-dua laluan ini, sebab itulah setiap baris di atas dilabel dengan salah satu daripadanya.'))+'</p>'
     +'<p class="note sub">'+(L('受体那一栏用的是典型三色型模板（350／440／530 nm）——不是任何一种虫的实测光谱，连蚜虫属内部的绿受体都在 518–530 nm 之间浮动。所以只给强／中／弱，不给百分比：给了数字就等于在假装精确。',
      'The receptor rows use a typical trichromat template at 350/440/530 nm — not a measured spectrum for any species; even within aphids the green peak moves between 518 and 530 nm. That is why they give strong/moderate/weak rather than a percentage: a number would be pretending to a precision that does not exist.',

     +'<p class="note sub">'+(L('受体激发是生理量，不等于诱捕效果。绿受体在 530 nm 最强，最好的黏板却是 560–600 nm 的黄——原因见「机理」页。',
      'Receptor excitation is a physiological quantity, not a measure of trapping power. The green receptor peaks at 530 nm while the best card is 560–600 nm yellow — the How it works tab explains why.',
      'Rangsangan reseptor ialah ukuran fisiologi, bukan ukuran keupayaan memerangkap. Reseptor hijau memuncak pada 530 nm manakala perangkap melekit terbaik ialah kuning 560–600 nm — tab Cara Berfungsi menerangkan sebabnya.'))+'</p>'
     +'<p class="note sub">'+(L('另有一条要讲明：●／●●／●●● 是<b>我把文献描述压成三档</b>的结果，不是文献报出的数值。每条后面的证据等级说的是这条结论出自哪种研究，不代表「强弱」这个分档本身有出处。',
      'One more thing to be clear about: ●/●●/●●● is <b>my compression of what the papers describe into three bands</b>, not a figure any paper reports. The evidence tier says what kind of study a finding came from; it does not mean the strength rating itself is sourced.',

/* Drag anywhere on the curve strip or the colour bar to scrub — the same
   wavelength state drives the slider, tick, cursor and hit list. The range
   input stays the keyboard path; these are pointer shortcuts on top of it. */
function attachScrub(el){
  if(!el) return;
  var sl = document.getElementById('nmSlider');
  function apply(ev){
    var r = el.getBoundingClientRect();
    if(!r.width) return;
    var f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    var v = Math.round((300 + f*400)/5)*5;
    if(v !== curNm){ curNm = v; sl.value = v; updateSpectrum(); }
  }
  el.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    apply(ev);
  });
  el.addEventListener('pointermove', function(ev){
    if(ev.buttons) apply(ev);
  });
}

var CURVE_H = 64, CURVE_PAD = 5;
function curveY(v){ return CURVE_H - CURVE_PAD - v*(CURVE_H - 2*CURVE_PAD); }
function buildCurves(){
  var svg = document.getElementById('recCurves');
  if(!svg) return;
  var h = '';
  for(var i=0;i<RECEPTORS.length;i++){
    var r = RECEPTORS[i], fill = 'M 300 '+curveY(0), line = '';
    for(var nm=300;nm<=700;nm+=4){
      var y = curveY(excite(nm,r)).toFixed(1);
      fill += ' L '+nm+' '+y;
      line += (line ? ' L ' : 'M ')+nm+' '+y;
    }
    fill += ' L 700 '+curveY(0)+' Z';
    /* dashed stroke on purpose: these are the schematic template curves,
       and a solid line would read as measured data */
    h += '<path d="'+fill+'" fill="'+r.color+'" opacity="0.13"/>'
       + '<path d="'+line+'" fill="none" stroke="'+r.color+'" stroke-width="1.8" stroke-dasharray="3 3.5" opacity="0.9"/>';
  }
  h += '<line id="curveCursor" y1="0" y2="'+CURVE_H+'" stroke="#f5f3ed" stroke-width="1.2" opacity="0.85"/>';
  for(var j=0;j<RECEPTORS.length;j++){
    h += '<circle id="curveDot'+j+'" r="3.6" fill="'+RECEPTORS[j].color+'" stroke="#0d1017" stroke-width="1.2"/>';
  }
  svg.innerHTML = h;
}

function updateSpectrum(){
  var nm = curNm;
  var nv = document.getElementById('nmVal'); if(!nv) return;
  nv.innerHTML = nm+'<small>nm</small>';
  nv.style.color = nmToText(nm);
  var b = bandOf(nm);
  document.getElementById('bandName').textContent = t(b);
  document.getElementById('bandNote').textContent = L(b.noteZh, b.noteEn, b.noteMs);
  document.getElementById('tick').style.left = ((nm-300)/400*100)+'%';

  var rh = '';
  for(var i=0;i<RECEPTORS.length;i++){
    var r = RECEPTORS[i], v = excite(nm,r), pc = Math.round(v*100);
    /* Deliberately a word, not a number: the curve is a generic trichromat
       template, so a two-figure percentage would claim a precision it cannot
       support — real peaks differ between species and even within aphids. */
    var word = v>=0.75 ? {zh:'强',en:'strong', ms:'kuat'}
             : v>=0.40 ? {zh:'中',en:'moderate', ms:'sederhana'}
             : v>=0.15 ? {zh:'弱',en:'weak', ms:'lemah'}
             : {zh:'极弱',en:'negligible', ms:'amat lemah'};
    rh += '<div class="recrow"><span class="nm"><b>'+t(r)+'</b><i>'+r.nm+'</i></span>'
        + '<span class="recbar"><i style="width:'+pc+'%;background:'+r.color+'"></i></span>'
        + '<em>'+t(word)+'</em></div>';
  }
  document.getElementById('recWrap').innerHTML = rh;
  document.getElementById('recTitle').textContent = L('受体激发', 'Receptor excitation', 'Rangsangan reseptor');
  document.getElementById('recBadge').innerHTML = badge('schematic');
  var cur = document.getElementById('curveCursor');
  if(cur){
    cur.setAttribute('x1', nm); cur.setAttribute('x2', nm);
    for(var ci=0;ci<RECEPTORS.length;ci++){
      var dot = document.getElementById('curveDot'+ci);
      dot.setAttribute('cx', nm);
      dot.setAttribute('cy', curveY(excite(nm, RECEPTORS[ci])).toFixed(1));
    }
  }

  var hits = [];
  for(var s=0;s<SPECIES.length;s++){
    var sp = SPECIES[s], best = null;
    for(var j=0;j<sp.resp.length;j++){
      var band = sp.resp[j];
      if(nm>=band.lo && nm<band.hi){ if(!best || band.level>best.level) best = band; }
    }
    if(best && best.level>0) hits.push({sp:sp,b:best});
  }
  hits.sort(function(a,b){ return b.b.level - a.b.level; });

  var mh = '';
  if(!hits.length){
    mh = '<div class="empty">'+(L('这个波长没有已记录的农业相关反应。'+(nm>620?'红光区——多数昆虫的受体到这里已经基本没有输出。':(nm<315?'UV-B／UV-C 在地面几乎不存在，也不用于诱虫。':'')),
      'No documented agricultural response at this wavelength. '+(nm>620?'Red — most insect receptors have effectively no output here.':(nm<315?'UV-B/UV-C barely reach the ground and are not used for trapping.':'')),
      'Tiada tindak balas pertanian yang direkodkan pada panjang gelombang ini. '+(nm>620?'Merah — kebanyakan reseptor serangga hampir tiada output di sini.':(nm<315?'UV-B/UV-C hampir tidak sampai ke tanah dan tidak digunakan untuk memerangkap.':''))))+'</div>';
  } else {
    /* Group by route. The explanation belongs to the route, not to each insect,
       so it is written once per group instead of repeating on every row. */
    var order = [], groups = {}, key;
    for(var k=0;k<hits.length;k++){
      var h = hits[k];
      key = MODE_NOTE[h.b.mode] ? h.b.mode : 'both';
      if(!groups[key]){ groups[key] = {max:0, items:[]}; order.push(key); }
      groups[key].items.push(h);
      if(h.b.level > groups[key].max) groups[key].max = h.b.level;
    }
    order.sort(function(x,y){ return groups[y].max - groups[x].max; });
    for(var gi=0; gi<order.length; gi++){
      key = order[gi];
      var g = groups[key];
      mh += '<div class="mgroup">'
          + '<button class="mghead" data-mode="'+key+'" aria-expanded="false">'
            + '<span class="mgname">'+modeLabel(key)+'</span>'
            + '<span class="mgcount">'+g.items.length+'</span>'
            + chevron()+'</button>'
          + '<div class="modenote">'+t(MODE_NOTE[key])+'</div>';
      for(var j=0;j<g.items.length;j++){
        var it = g.items[j];
        var dots = ['','●','●●','●●●'][it.b.level];
        mh += '<div class="hit"><span class="dots" style="color:'+nmToText(nm)+'">'+dots+'</span>'
            + '<span class="nmz">'+t(it.sp)+'</span>'+badge(it.b.tier)+'</div>';
      }
      mh += '</div>';
    }
  }
  var hl = document.getElementById('hitList');
  hl.innerHTML = mh;
  hl.querySelectorAll('.mghead').forEach(function(b){
    b.addEventListener('click', function(){
      var note = b.nextElementSibling;
      if(note && note.classList.contains('modenote')){
        note.classList.toggle('open');
        b.classList.toggle('open');
        b.setAttribute('aria-expanded', note.classList.contains('open') ? 'true' : 'false');
      }
    });
  });

  document.getElementById('modeHint').textContent = L('按作用路径分组——黏板和灯是两套机制，不能互换。● 越多＝该波段记录到的反应越强。点标题看这条路径怎么起作用。',
      'Grouped by route, because card and lamp are different mechanisms and are not interchangeable. More ● = stronger documented response. Tap a heading to see how that route works.',
      'Dikumpulkan mengikut laluan, kerana perangkap melekit dan lampu ialah mekanisme berbeza dan tidak boleh saling menggantikan. Lebih banyak ● = tindak balas didokumenkan yang lebih kuat. Ketik tajuk untuk melihat cara laluan itu berfungsi.');
}

/* =========================================================
   VIEW: WHEN TO REPLACE A CARD
   A standard-area comparator. People systematically misjudge percent cover by
   eye, so the patches are generated at exact known coverages to compare against.
   ========================================================= */
var COV_STEPS = [5,10,15,20,25,30,35,40,50,60,70,80];
var covPick = 15;
var COV_CACHE = {};

function covPatch(pct, w, hgt){
  var ck = pct+'x'+w+'x'+hgt;
  if(COV_CACHE[ck]) return COV_CACHE[ck];
  /* deterministic placement so a given panel always looks the same */
  var seed = pct*7919 + 13, area = w*hgt;
  /* mulberry32 — a plain LCG degenerates on some seeds and repeats dot
     positions, which silently drops the painted fraction. */
  function rnd(){
    seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  var rx=1.15, ry=0.62, dotArea=Math.PI*rx*ry;
  /* Two corrections, or the panel would not show the coverage it claims.
     1. Ellipses are scaled by a random factor in [0.8,1.3]; mean AREA scales
        by E[s^2] = 1.1233, not by E[s].
     2. Dots land independently and overlap, so visible cover is
        1 - exp(-lambda) for total drawn area lambda. Invert it. */
  var meanS2 = 1.1233;
  var lambda = -Math.log(1 - pct/100);
  /* Scatter centres over the panel PLUS a margin, so dots may overhang and
     clip at the edges. Insetting them instead leaves the margins under-filled,
     and the shortfall grows with coverage. */
  var m = rx*1.3;
  var outerW = w + 2*m, outerH = hgt + 2*m;
  var count = Math.round(outerW*outerH*lambda/(dotArea*meanS2));
  var g='';
  for(var i=0;i<count;i++){
    var cx=rnd()*outerW - m, cy=rnd()*outerH - m;
    var rot=Math.round(rnd()*180), sc=0.8+rnd()*0.5;
    g += '<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+(rx*sc).toFixed(2)
       + '" ry="'+(ry*sc).toFixed(2)+'" transform="rotate('+rot+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
  }
  COV_CACHE[ck] = '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none" class="covsvg">'
       + '<rect width="'+w+'" height="'+hgt+'" fill="#f2d63d"/><g fill="#2b2410">'+g+'</g></svg>';
  return COV_CACHE[ck];
}

function covVerdict(pct){
  if(pct < 15) return {zh:'新板。继续用。',en:'Fresh. Keep using it.', ms:'Baharu. Teruskan guna.',cls:'ok'};
  if(pct < 20) return {zh:'正常。还在有效工作，继续挂。',en:'Normal. Still working — leave it up.', ms:'Biasa. Masih berfungsi — biarkan tergantung.',cls:'ok'};
  if(pct < 30) return {zh:'接近该换了。粘力还在，但已经开始变差，下一轮巡园就换掉。',en:'Approaching replacement. Still catching, but falling off — swap it on your next round.', ms:'Hampir perlu diganti. Masih menangkap, tetapi semakin berkurang — tukar pada pusingan pemeriksaan seterusnya.',cls:'warn'};
  if(pct < 40) return {zh:'换掉。可用的胶面已经不够，飞过来的虫有相当一部分粘不住了。',en:'Replace it. Too little free adhesive left — a sizeable share of what arrives is no longer being held.', ms:'Gantikan. Gam bebas yang tinggal terlalu sedikit — sebahagian besar serangga yang tiba tidak lagi melekat.',cls:'warn'};
  if(pct < 60) return {zh:'早该换了。这张板现在挡的虫，比它抓的还多。',en:'Well overdue. This card is now blocking more insects than it holds.', ms:'Sudah lama lewat. Papan ini kini menghalang lebih banyak serangga daripada yang ditangkapnya.',cls:'bad'};
  return {zh:'这张板已经不抓虫了，只是挂在那里。如果每次收板都是这个样子，说明换板间隔定得太长，不是虫太多。',en:'This card has stopped catching. It is just hanging there. If cards routinely come back like this, the replacement interval is too long rather than the pressure being high.', ms:'Papan ini sudah berhenti menangkap. Ia sekadar tergantung di situ. Jika papan kerap kembali dalam keadaan begini, selang penggantian terlalu panjang, bukannya tekanan serangga yang tinggi.',cls:'bad'};
}

function renderCoverage(){
  var el = document.getElementById('v-cardid');
  var h = '<p class="lede">'+(L('把板举起来，和下面的色块比一比，选最接近的一格。人眼估「覆盖了百分之几」是出了名的不准——低的会高估，高的会低估——所以下面每一格都是按精确面积生成的参照，不是画着好看。',
      'Hold the card up, compare it with the panels below, and tap the closest match. People are notoriously bad at judging percent cover by eye — overestimating at the low end, underestimating at the high end — so each panel is generated at an exact area fraction to compare against, not drawn by feel.',
      'Angkat perangkap melekit itu, bandingkan dengan panel di bawah, dan ketik padanan yang paling hampir. Manusia terkenal lemah menganggar peratus litupan dengan mata kasar — terlebih anggar pada hujung rendah, terkurang anggar pada hujung tinggi — jadi setiap panel dijana pada pecahan luas yang tepat untuk dijadikan perbandingan, bukan dilukis ikut rasa.'))+'</p>';

  h += '<div class="covgrid">';
  for(var i=0;i<COV_STEPS.length;i++){
    var pc = COV_STEPS[i];
    h += '<button class="covcell'+(covPick===pc?' on':'')+'" data-cov="'+pc+'">'
       + covPatch(pc, 60, 40)
       + '<span class="covpc">'+pc+'%</span></button>';
  }
  h += '</div>';

  h += '<div class="card" id="covVerdict"></div>';

  h += '<div class="card"><h3>'+(L('比对时注意', 'When you compare', 'Semasa membandingkan'))+' '+badge('field')+'</h3>'
    + '<p class="note">'+(L('真板不会像上面这样均匀。白粉虱和蓟马在板上会往<b>两侧和上缘</b>集中，所以常常是边缘先满、中间还空。<b>按最密的那一片算，不要按整张板的平均算</b>——虫是从边缘进来的，边缘一饱和，这张板对新来的虫就已经不灵了，中间那块空白救不了它。',
      'A real card does not fill evenly like the panels above. Whiteflies and thrips cluster toward the <b>sides and upper edge</b>, so the margins fill while the middle is still open. <b>Judge by the densest patch, not by the average.</b> Insects arrive at the margin, and once the margin saturates the card has stopped working for new arrivals — the empty middle does not rescue it.',
      'Perangkap melekit sebenar tidak penuh secara sekata seperti panel di atas. Lalat putih dan trips berkumpul ke arah <b>sisi dan tepi atas</b>, jadi bahagian tepi penuh sementara bahagian tengah masih kosong. <b>Nilai berdasarkan tompok paling padat, bukan purata.</b> Serangga tiba di bahagian tepi, dan sebaik sahaja bahagian tepi tepu, perangkap itu sudah berhenti berfungsi untuk serangga yang baru tiba — bahagian tengah yang kosong tidak dapat menyelamatkannya.'))+'</p></div>'
    + '<div class="card"><h3>'+(L('换板规则', 'The replacement rule', 'Peraturan penggantian'))+' '+badge('mech')+'</h3>'
    + '<ul class="tight">'
    + '<li>'+(L('<b>覆盖到 20–30% 就换</b>，不要等它看起来「满」。看起来满的时候，它早就不抓虫了。', '<b>Replace at 20–30% cover.</b> Do not wait until it looks full — by the time it looks full it stopped catching a long while ago.', '<b>Ganti pada litupan 20–30%.</b> Jangan tunggu sehingga ia kelihatan penuh — apabila ia kelihatan penuh, ia sudah lama berhenti menangkap.'))+'</li>'
    + '<li>'+(L('<b>或者每周换一次</b>，以先到者为准。虫压高的时候，一周之内就会到 30%。', '<b>Or replace weekly</b>, whichever comes first. Under pressure a card reaches 30% well inside a week.', '<b>Atau ganti setiap minggu</b>, mana-mana yang dahulu. Ketika tekanan serangga tinggi, perangkap melekit boleh mencapai 30% jauh sebelum cukup seminggu.'))+'</li>'
    + '<li>'+(L('覆盖率不是唯一理由：起了一层灰、淋过大雨、胶面结皮不粘手、或者黄色被晒褪——任何一条都要换。', 'Cover is not the only trigger: a film of dust, heavy rain, glue that has skinned over and no longer tacks, or yellow that has faded in the sun — any one of those means replace.', 'Litupan bukan satu-satunya petanda: lapisan debu, hujan lebat, gam yang sudah mengering di permukaan dan tidak lagi melekit, atau warna kuning yang pudar akibat matahari — mana-mana satu daripadanya bermakna perlu diganti.'))+'</li>'
    + '</ul></div>';

  h += '<div class="card"><h3>'+(L('为什么门槛这么低', 'Why the threshold is this low', 'Mengapa ambangnya serendah ini'))+' '+badge('field')+'</h3>'
    + '<p class="note">'+(L('因为一张板的捕获力不是「满了才失效」，而是<b>从第一只虫开始就在往下掉，而且掉得不是线性的</b>。在一项诱蛾板的饱和研究里，虫体和鳞片在胶面上堆积，捕获效率随之下降，每板 50 只以下就已经呈非线性衰减。',
      'Because a card does not work fully until it is full and then stop. Its catching power <b>starts falling from the first insect, and not in a straight line</b>. In a moth-trap saturation study, capture efficiency fell as bodies and scales built up on the glue, with the decline already nonlinear below 50 moths per trap.',
      'Kerana perangkap melekit bukannya berfungsi sepenuhnya sehingga penuh lalu berhenti. Daya tangkapnya <b>mula menurun sejak serangga pertama, dan tidak secara garis lurus</b>. Dalam satu kajian ketepuan perangkap rama-rama, kecekapan tangkapan menurun apabila badan dan sisik terkumpul pada gam, dengan penurunan sudah tidak linear di bawah 50 ekor rama-rama setiap perangkap.'))+'</p>'
    + '<p class="note">'+(L('两件事同时发生：可用的胶面变少，而且已经粘住的虫体本身成了一层垫子，后来的虫踩在上面反而能飞走。所以一张 40% 的板不是「还有 60% 的能力」——它的实际捕获力远低于 60%。',
      'Two things happen at once: there is less free adhesive, and the bodies already stuck form a layer that later arrivals can land on and walk off. So a card at 40% cover does not have 60% of its power left — the real figure is well below that.',
      'Dua perkara berlaku serentak: gam yang masih bebas semakin berkurang, dan badan serangga yang sudah melekat membentuk lapisan yang membolehkan serangga yang tiba kemudian hinggap lalu berjalan pergi. Jadi perangkap melekit pada litupan 40% tidak lagi mempunyai 60% daya tangkapnya — angka sebenar jauh lebih rendah daripada itu.'))+'</p>'
    + '<p class="note sub">'+(L('（如果你另外还在记数，那就多一条理由：饱和程度不同的两张板，数字之间没有可比性——看起来「虫少了」，其实只是板满了。）',
      '(If you also keep counts, there is a second reason: two cards at different saturation are not comparable. It reads as fewer insects when it is really just a fuller card.)',
      '(Jika anda juga mencatat kiraan, ada sebab kedua: dua perangkap melekit pada tahap ketepuan berbeza tidak boleh dibandingkan. Ia kelihatan seperti serangga berkurang padahal sebenarnya perangkap itu cuma lebih penuh.)'))+'</p></div>';

  h += '<div class="card"><h3>'+(L('关于 20–30% 这个数字', 'On the 20–30% figure', 'Tentang angka 20–30%'))+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(L('要讲清楚：目前没有同行评审的研究给出一个「换板覆盖率」的标准值。20–30% 来自商业与推广渠道的通行做法，同一类来源里也有人写 50–70%。我采用低的那一档，理由是上面那条饱和曲线——既然衰减从很早就开始，把门槛定低的代价只是多花几张板，定高的代价是整季的数字都不能比。',
      'Stated plainly: no peer-reviewed study gives a standard replacement coverage. The 20–30% figure comes from commercial and extension practice, and the same kind of source elsewhere says 50–70%. I use the lower band because of the saturation curve above — since the decline starts early, setting the threshold low costs a few extra cards, while setting it high costs the comparability of a whole season of numbers.',
      'Secara terus terang: tiada kajian yang disemak rakan sebaya memberikan litupan penggantian piawai. Angka 20–30% datang daripada amalan komersial dan khidmat pengembangan, dan sumber jenis yang sama di tempat lain menyebut 50–70%. Saya menggunakan julat yang lebih rendah kerana lengkung ketepuan di atas — oleh sebab penurunan bermula awal, menetapkan ambang yang rendah hanya menambah kos beberapa perangkap melekit, manakala menetapkannya tinggi mengorbankan kebolehbandingan data sepanjang satu musim.'))+'</p></div>';

  el.innerHTML = h;
  /* The twelve panels are ~7000 SVG elements. Re-rendering the view on every
     tap re-parses all of them, so a tap only restyles the cells and rewrites
     the verdict card. */
  var cells = el.querySelectorAll('[data-cov]');
  function paintVerdict(){
    var v = covVerdict(covPick), box = document.getElementById('covVerdict');
    if(!box) return;
    box.className = 'card cov-'+v.cls;
    box.innerHTML = '<h3>'+covPick+'% '+(L('覆盖', 'covered', 'dilitupi'))+'</h3>'
      + '<p class="note" style="font-size:1.05rem;font-weight:600">'+t(v)+'</p>';
  }
  cells.forEach(function(b){
    b.addEventListener('click', function(){
      covPick = +b.getAttribute('data-cov');
      cells.forEach(function(c){ c.classList.toggle('on', c === b); });
      paintVerdict();
    });
  });
  paintVerdict();
}

      'A lamp at night is not attracting them in the first place — they fly by day and respond to an illuminated surface, not to a source. Switching to warm or red light will not reduce this group; it will only feel like an action. What works on them sits on the daytime side: card colour and placement.',
      'Lampu pada waktu malam bukanlah yang menarik mereka pada mulanya — mereka terbang pada waktu siang dan bertindak balas terhadap permukaan yang diterangi, bukan terhadap sumber cahaya. Menukar kepada cahaya hangat atau merah tidak akan mengurangkan kumpulan ini; ia hanya akan terasa seperti satu tindakan. Apa yang berkesan terhadap mereka terletak pada waktu siang: warna dan penempatan perangkap melekit.')))+'</p>'

      'One exception worth knowing: UV does not lure them, but it does enable their take-off and dispersal. Cutting UV with blocking film or photoselective netting does reduce immigration in a nursery — but that is a daytime measure and has nothing to do with your night lighting.',

      'Night-flying insects are most sensitive to short wavelengths, so stripping UV and blue is the right direction. But "red is harmless" overstates it: red matched darkness for larval development, yet it still reduced female pheromone output, and field mating fell from 53% under a dark control to 28% under red. Two different thresholds — attracting an insect needs a strong signal, disrupting its night only needs "not dark".',

      'Methyl eugenol is an <b>odour lure</b>, and its rules differ from both cards and lamps: hang traps in the <b>shaded mid-canopy</b>, out of direct sun — heat and direct exposure shorten the lure\'s life — with clearance around them so the plume can spread. Weight them toward the block margin and the source direction, and add traps around ripening fruit.',

        + '<p class="note sub">'+(L('要有心理准备：即使密度拉满，黏板也压不住一次爆发。它降低的是飞行压力和新定殖，真正把虫口压下去还是要靠其他手段。',
      'Expect this much and no more: even at full density, cards will not bring an outbreak down. They reduce flight pressure and new colonisation; something else has to do the actual knockdown.',
      'Jangkakan setakat ini sahaja dan tidak lebih: walaupun pada kepadatan penuh, perangkap melekit tidak akan dapat menurunkan ledakan serangan. Ia mengurangkan tekanan penerbangan dan kolonisasi baharu; kaedah lain perlu melakukan penurunan populasi yang sebenar.'))+'</p></div>';
    }
  }

  el.innerHTML = '<p class="lede">'+(L('选目标和目的，得到一条有出处的建议——外加它的代价。',
      'Pick a target and a goal for a sourced recommendation, and the cost that comes with it.',
      'Pilih sasaran dan matlamat untuk mendapatkan cadangan bersumber, beserta kos yang datang bersamanya.'))+'</p>'
    + '<h3 style="font-size:1.02rem;margin-bottom:10px">'+(L('目标害虫', 'Target', 'Sasaran'))+'</h3>'
    + '<div class="opts">'+tb+'</div>'
    + '<h3 style="font-size:1.02rem;margin:20px 0 10px">'+(L('你要达到什么', 'What you want', 'Matlamat anda'))+'</h3>'
    + '<div class="opts">'+gb+'</div>'
    + body;

  el.querySelectorAll('[data-t]').forEach(function(b){
    b.addEventListener('click',function(){ advT=b.getAttribute('data-t'); renderAdvisor(); });
  });
  el.querySelectorAll('[data-goal]').forEach(function(b){
    b.addEventListener('click',function(){ advG=b.getAttribute('data-goal'); renderAdvisor(); });
  });
}

var DURIAN = [
{ zh:'幼树期（1–3 年）', en:'Young trees (1–3 yrs)', ms:'Pokok muda (1–3 thn)',
  pestZh:'木虱、叶蝉、真菌蚊、蚜虫——都在新梢上',
  pestEn:'Psyllids, leafhoppers, fungus gnats, aphids — all on the flush', pestMs:'Psilid, bena daun, agas kulat, afid — semuanya pada pucuk muda',
  doZh:'黄板，每英亩约 20 张（每 200 m² 一张），垂直挂在抽梢高度、冠层稍上方，每周查一次。这个阶段树矮、冠层薄，黏板是全周期里最有把握的一环。',
  doEn:'Yellow cards, about 20 per acre — one per 200 m² — vertical at flush height just above the canopy, checked weekly. Trees are short and canopies thin at this stage, so cards are the most reliable tool of the whole cycle.', doMs:'Papan kuning, kira-kira 20 sekaki ekar — satu bagi setiap 200 m² — tegak pada paras pucuk muda sedikit di atas kanopi, diperiksa setiap minggu. Pokok masih rendah dan kanopi nipis pada peringkat ini, jadi papan ialah alat paling boleh dipercayai sepanjang kitaran.',
  tier:'field',
  watchZh:'新梢抽出时才是关键窗口，不抽梢时可以把板收起来——木虱跟着嫩叶走。',
  watchEn:'The flush window is the whole game. Between flushes you can take the cards down — psyllids follow the young leaves.', watchMs:'Tempoh pucuk muda ialah segala-galanya. Di antara musim pucuk anda boleh menurunkan papan — psilid mengikut daun muda.' },
{ zh:'花期', en:'Bloom', ms:'Berbunga',
  pestZh:'蓟马为主，其次夜蛾幼虫、花甲虫',
  pestEn:'Mainly thrips, then noctuid larvae and flower beetles', pestMs:'Terutamanya trips, kemudian larva noktuid dan kumbang bunga',
  doZh:'黄板，每英亩约 20 张，与花房同高。通行的说法是花期用蓝板，但那条来自西花蓟马；榴莲花期的 Scirtothrips dorsalis 属于偏黄的那一属，在芒果园六色对照里偏黄，槟城的芒果园研究也验证了黄板计数与花穗实际虫量相关。挂两周捕获量仍低，再整批换蓝板。',
  doEn:'Yellow cards, about 20 per acre, at flower height. The standard advice for bloom is blue, but that comes from Frankliniella. The durian bloom thrips Scirtothrips dorsalis is in the yellow-preferring genus, went to yellow in the six-colour mango trial, and Penang mango work validated yellow-trap counts against actual numbers on the panicles. If catch is still low after two weeks, switch the batch to blue.', doMs:'Papan kuning, kira-kira 20 sekaki ekar, pada paras bunga. Nasihat standard untuk musim berbunga ialah biru, tetapi itu berasal daripada Frankliniella. Trips bunga durian Scirtothrips dorsalis tergolong dalam genus yang lebih suka kuning, memilih kuning dalam ujian enam warna di dusun mangga, dan kajian mangga di Pulau Pinang mengesahkan bilangan tangkapan perangkap kuning berbanding bilangan sebenar pada jambak bunga. Jika tangkapan masih rendah selepas dua minggu, tukar kumpulan papan itu kepada biru.',
  tier:'field',
  watchZh:'这是全年最该克制的阶段。榴莲花在夜间散粉，主要传粉者是果蝠（尤其是长舌果蝠 Eonycteris spelaea），泰国和苏拉威西的相机陷阱研究都确认了这一点；夜蛾、夜行胡蜂、甲虫甚至蓟马也被记录为次要传粉者。花期在花房高度开 UV 灯，是拿坐果率去换蛾。要开就远离花区、限时。',
  watchEn:'This is the stage to hold back. Durian sheds pollen at night and its main pollinators are fruit bats, above all the cave nectar bat Eonycteris spelaea — confirmed by camera-trap work in Thailand and Sulawesi. Moths, nocturnal wasps, beetles and even thrips are recorded as secondary pollinators. A UV lamp at flower height during bloom trades fruit set for moths. If you run one, keep it away from the flowering zone and limit the hours.', watchMs:'Inilah peringkat untuk menahan diri. Durian melepaskan debunga pada waktu malam dan pendebunga utamanya ialah kelawar buah, terutamanya kelawar gua nektar Eonycteris spelaea — disahkan oleh kajian perangkap kamera di Thailand dan Sulawesi. Rama-rama, tebuan malam, kumbang malah trips direkodkan sebagai pendebunga sekunder. Lampu UV pada paras bunga semasa berbunga menukar pembentukan buah dengan tangkapan rama-rama. Jika anda menggunakannya, jauhkan dari zon berbunga dan hadkan jam operasi.' },
{ zh:'坐果期', en:'Fruit set', ms:'Pembentukan buah',
  pestZh:'夜蛾、甲虫、果实蝇',
  pestEn:'Noctuids, beetles, fruit flies', pestMs:'Noktuid, kumbang, lalat buah',
  doZh:'UV-A 灯（365–400 nm），傍晚开到十点左右，园缘与果位层。这一步针对的就是两种蛀果蛾：<b>榴莲果螟</b>（最重要的果实害虫）与<b>榴莲种籽蛀蛾</b>（泰国出口榴莲的头号采后害虫，推广指引明确建议灯诱压低成蛾）。种籽蛀蛾另有硬证据的补充手段——坐果后 6 周<b>套袋</b>，试验蛀果率 0% 对 5.44%。蛾一旦入果灯就管不到了，窗口只在成虫期。黄板减到每英亩 4–5 张维持基础监测。',
  doEn:'UV-A lamps at 365–400 nm, dusk to about ten, at the margin and fruit zone. This step exists for the two fruit-boring moths: the <b>durian fruit borer</b> (the most serious fruit pest) and the <b>durian seed borer</b> (the leading postharvest pest of Thai export durian, for which extension guidance explicitly recommends light traps). For the seed borer there is a hard-evidence companion — <b>bagging</b> at 6 weeks after fruit set, 0% infestation against 5.44% in the trial. Once a borer is inside no lamp reaches it: the window is the adult flight. Cards drop to 4–5 per acre for baseline monitoring.', doMs:'Lampu UV-A pada 365–400 nm, dari senja hingga kira-kira pukul sepuluh malam, di pinggir dan zon buah. Langkah ini wujud untuk dua rama-rama pengorek buah: <b>pengorek buah durian</b> (perosak buah paling serius) dan <b>pengorek biji durian</b> (perosak lepas tuai utama bagi durian eksport Thailand, yang panduan pengembangan pertanian secara jelas mengesyorkan lampu perangkap). Untuk pengorek biji ada pelengkap berbukti kukuh — <b>pembalutan buah</b> pada 6 minggu selepas pembentukan buah, 0% serangan berbanding 5.44% dalam ujian. Sebaik pengorek berada di dalam, tiada lampu dapat mencapainya: peluangnya ialah semasa dewasa terbang. Papan dikurangkan kepada 4–5 sekaki ekar untuk pemantauan asas.',
  tier:'field',
  watchZh:'诱虫灯是短距离的：2024 年的三维飞行轨迹研究显示昆虫不是被远处的灯吸引过来，而是飞近之后被困住。所以「一盏灯管几英亩」这种算法本身就不成立。',
  watchEn:'Lamps are short-range: the 2024 3-D flight-path work showed insects are not drawn in from a distance but trapped once they fly close. That makes any "one lamp covers N acres" arithmetic unsound from the start.', watchMs:'Lampu berjarak dekat: kajian laluan terbang 3-D 2024 menunjukkan serangga tidak ditarik dari jauh tetapi terperangkap apabila terbang dekat. Ini menjadikan sebarang kiraan "satu lampu meliputi N ekar" tidak kukuh sejak awal.' },
{ zh:'成熟采收期', en:'Ripening & harvest', ms:'Masak & tuai',
  pestZh:'果实蝇为主（落果、裂果继发）',
  pestEn:'Mainly fruit flies (on fallen and split fruit)', pestMs:'Terutamanya lalat buah (pada buah gugur dan buah merekah)',
  doZh:'甲基丁香油诱捕器＋清园落果，两者缺一不可。黄板维持每英亩 4–5 张的基础监测量。',
  doEn:'Methyl eugenol traps plus clearing fallen fruit — both, not either. Keep cards at the 4–5 per acre baseline.', doMs:'Perangkap metil eugenol serta membersihkan buah gugur — kedua-duanya, bukan salah satu. Kekalkan papan pada asas 4–5 sekaki ekar.',
  tier:'field',
  watchZh:'甲基丁香油只诱雄虫，而且只针对果实蝇——蛀果蛾类它不覆盖。只挂诱捕器不清落果，是在数果实蝇，不是在防果实蝇。果面若见白色棉絮状的<b>粉蚧</b>：板和灯都帮不了，处理蚂蚁和通风才有用（见虫谱）。',
  watchEn:'Methyl eugenol lures males only, and only fruit flies — the boring moths are outside its reach. Traps without windfall clearing means counting fruit flies rather than controlling them. And white cottony <b>mealybugs</b> on the fruit surface are not a card or lamp problem — ants and airflow are the levers (see the Insects tab).', watchMs:'Metil eugenol hanya menarik lalat jantan, dan hanya lalat buah — rama-rama pengorek di luar jangkauannya. Perangkap tanpa membersihkan buah gugur bermakna mengira lalat buah, bukan mengawalnya. Dan <b>koya</b> putih berkapas pada permukaan buah bukan masalah papan atau lampu — semut dan pengudaraan ialah kuncinya (lihat tab Serangga).' }
];

function renderDurian(){
  var el = document.getElementById('v-durian');
  var h = '<p class="lede">'+(L('按物候分阶段，每一阶段都给出可以直接照做的默认配置。密度沿用通行的监测惯例：垂直挂在冠层稍上方，每 200 m² 一张，约合每英亩 20 张。榴莲园本身没有专门的密度试验，但这个惯例在多种作物上通用，比凭空猜一个数字可靠得多。先照做，记录捕获量，再按自己的情况加减。',
      'By phenological stage, each with a default you can act on directly. Density follows the standard monitoring convention: vertical, just above the canopy, about one card per 200 m² — roughly 20 per acre. There is no density trial specific to durian, but the convention holds across many crops and beats a guessed figure. Follow it, record the catch, then adjust for your own block.',
      'Mengikut peringkat fenologi, setiap satu dengan tetapan lalai yang boleh terus anda gunakan. Kepadatan mengikut amalan pemantauan standard: menegak, sedikit di atas kanopi, kira-kira satu papan bagi setiap 200 m² — lebih kurang 20 bagi setiap ekar. Tiada ujian kepadatan khusus untuk durian, tetapi amalan ini terpakai merentas banyak tanaman dan lebih baik daripada angka tekaan. Ikutinya, rekodkan tangkapan, kemudian laraskan mengikut blok anda sendiri.'))+'</p>';
  for(var i=0;i<DURIAN.length;i++){
    var d = DURIAN[i];
    h += '<div class="card"><h3>'+t(d)+'</h3>'
      + '<div class="kv"><b>'+(L('主要害虫', 'Main pests', 'Perosak utama'))+'</b><span>'+(L(d.pestZh, d.pestEn, d.pestMs))+'</span></div>'
      + '<p class="note">'+(L(d.doZh, d.doEn, d.doMs))+' '+badge(d.tier)+'</p>'
      + '<div class="caution">'+(L(d.watchZh, d.watchEn, d.watchMs))+'</div></div>';
  }
  h += '<div class="card"><h3>'+(L('装在哪里：黏板', 'Placement: cards', 'Penempatan: papan'))+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(L('<b>最容易做错的一条：把板挂进阴影里。</b>黏板靠反射工作，冠层深处没有光照在色面上，那张板就是块黑板。挂在冠层外缘、开口处或迎光面。',
      '<b>The easiest thing to get wrong is hanging cards in shade.</b> A card works by reflection; deep inside the canopy there is no light on the coloured surface and the card is just a black rectangle. Hang them at the canopy edge, in a gap, or on the outward face.',
      '<b>Kesilapan paling mudah ialah menggantung papan di tempat teduh.</b> Papan berfungsi melalui pantulan; jauh di dalam kanopi tiada cahaya pada permukaan berwarna dan papan itu hanyalah segi empat hitam. Gantungkannya di pinggir kanopi, di celah yang terbuka, atau di bahagian luar pokok.'))+'</p>'
    + '<ul class="tight">'
    + '<li>'+(L('高度跟着虫找的那一层：抽梢期与新梢同高，花期与花房同高，坐果后回到梢层。乔木不能照搬「冠层稍上方」——那条规则是给矮作物的。', 'Height follows the layer the insect is searching: at the flush, then at panicle height during bloom, then back to the flush. Do not copy "just above the canopy" onto a tall tree — that rule was written for low crops.', 'Ketinggian mengikut lapisan tempat serangga mencari: di paras pucuk muda, kemudian di paras jambak bunga semasa berbunga, kemudian kembali ke paras pucuk muda. Jangan salin "sedikit di atas kanopi" pada pokok yang tinggi — peraturan itu ditulis untuk tanaman rendah.'))+'</li>'
    + '<li>'+(L('垂直，两面露出，与枝叶留距离；朝向一致、位置固定。', 'Vertical, both faces exposed, clear of foliage; same orientation and fixed positions.', 'Menegak, kedua-dua muka terdedah, bebas daripada daun; orientasi sama dan kedudukan tetap.'))+'</li>'
    + '<li>'+(L('多的板放园边和迎风面——虫从外面进来，捕获量随离园边距离下降。', 'Extra cards on the block edge and windward side — insects arrive from outside, and catch falls with distance from the edge.', 'Papan tambahan di pinggir blok dan di sebelah arah datangnya angin — serangga datang dari luar, dan tangkapan berkurang semakin jauh dari pinggir.'))+'</li>'
    + '</ul></div>'
    + '<div class="card"><h3>'+(L('装在哪里：诱虫灯', 'Placement: lamps', 'Penempatan: lampu'))+' '+badge('measured')+'</h3>'
    + '<p class="note">'+(L('<b>灯是短距离的。</b>它困住飞近的虫，不会把远处的虫拉过来——所以它保护的是自己周围那一圈。装在虫来的那一边（邻着的杂林、老园、去年发生最重的一侧），不要装在园子中央；坐果期装在要保护的果位那一层。几盏小的胜过一盏大的。',
      '<b>Lamps are short-range.</b> They trap what flies close rather than drawing insects in, so a lamp protects the ring around itself. Site them on the side the moths come from — adjacent scrub, an older block, whichever side was worst last season — not in the middle. At fruit set, put them at the fruit zone you are protecting. Several modest lamps beat one powerful one.',
      '<b>Jarak tindakan lampu adalah dekat.</b> Lampu memerangkap serangga yang terbang berhampiran, bukan menarik serangga dari jauh, jadi lampu hanya melindungi kawasan di sekelilingnya. Letakkannya di sebelah arah datangnya rama-rama — semak bersebelahan, blok yang lebih tua, sebelah mana yang paling teruk musim lalu — bukan di tengah. Semasa pembentukan buah, letakkannya di zon buah yang anda lindungi. Beberapa lampu sederhana lebih baik daripada satu lampu yang kuat.'))+'</p>'
    + '<div class="caution">'+(L('<b>花期例外：不要装在花房高度。</b>榴莲主要靠果蝠和夜行昆虫传粉，花期在花层开灯是拿坐果率去换蛾。要开就远离花区并限时。',
      '<b>Bloom exception: not at flower height.</b> Durian is mainly bat- and night-insect-pollinated, so a lamp in the flowering zone during bloom trades fruit set for moths. If you run one, keep it away from the flowering area and limit the hours.',
      '<b>Pengecualian semasa berbunga: bukan di paras bunga.</b> Durian kebanyakannya didebungakan oleh kelawar dan serangga malam, jadi lampu di zon berbunga semasa musim bunga mengorbankan pembentukan buah demi menangkap rama-rama. Jika anda menggunakannya, jauhkan dari kawasan berbunga dan hadkan jam penggunaannya.'))+'</div></div>'
    + '<div class="card"><h3>'+(L('适用范围与外推说明', 'Scope and extrapolation', 'Skop dan ekstrapolasi'))+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(L('<b>密度指标可外推，高度指标不可。</b>每 200 m² 一张的布板密度在多种作物上有一致的实践依据，外推至榴莲园的风险较低。挂板高度则不同：现有黏板研究均在矮秆作物或温室条件下完成，其冠层结构与乔木果园不可直接类比，因此本页的高度建议属机理外推，尚未经田间验证。榴莲园的诱虫灯安装高度与间距亦无公开试验数据。',
      '<b>The density figure extrapolates; the height figures do not.</b> One card per 200 m² rests on consistent practice across a range of crops, and carries low risk when transferred to durian. Card height is a different matter: the available sticky-card trials were conducted on low-growing crops or under greenhouse conditions, whose canopy structure is not directly comparable to a tree orchard, so the height guidance on this page is extrapolated from mechanism and remains unvalidated in the field. No published data exist for lamp height or spacing in durian either.',
      '<b>Angka kepadatan boleh diekstrapolasi; angka ketinggian tidak.</b> Satu papan bagi setiap 200 m² berasaskan amalan yang konsisten merentas pelbagai tanaman, dan berisiko rendah apabila dipindahkan kepada durian. Ketinggian papan adalah perkara yang berbeza: ujian perangkap melekit yang ada dijalankan pada tanaman rendah atau dalam keadaan rumah hijau, yang struktur kanopinya tidak boleh dibandingkan secara langsung dengan dusun pokok, jadi panduan ketinggian di halaman ini diekstrapolasi daripada mekanisme dan masih belum disahkan di ladang. Data terbitan juga tiada untuk ketinggian atau jarak antara lampu di kebun durian.'))+'</p>'
    + '<p class="note">'+(L('<b>关于诱虫灯布设位置，现有依据存在分歧。</b>诱虫灯作用距离短，据此应布设于园内目标区附近；而传统布防原则主张将诱源置于外围，以免将害虫引向受保护对象。鉴于作用距离确实有限，后一项顾虑的权重已经下降，但现有证据不足以将其排除。',
      '<b>The evidence on lamp siting is divided.</b> Short-range entrapment argues for placing lamps near the target area inside the block, while the established principle of keeping an attractant at the perimeter argues against drawing pests toward the crop being protected. Given how limited the range genuinely is, the second consideration carries less weight than it once did, but the available evidence is not sufficient to dismiss it.',
      '<b>Bukti tentang penempatan lampu berbelah bahagi.</b> Pemerangkapan jarak dekat menyokong penempatan lampu berhampiran kawasan sasaran di dalam blok, manakala prinsip mantap untuk meletakkan penarik di perimeter menentang tindakan menarik perosak ke arah tanaman yang dilindungi. Memandangkan jaraknya memang terhad, pertimbangan kedua kurang berat berbanding dahulu, tetapi bukti yang ada tidak mencukupi untuk menolaknya.'))+'</p>'
    + '<p class="note sub">'+(L('本软件采取的折中方案：常规布设于虫源方向的园缘；坐果期移至需保护的果位层；花期一律远离花区并限时开启。',
      'The compromise adopted here: site lamps at the block margin on the side the pressure comes from; move them to the fruit zone being protected at fruit set; and during bloom keep them away from the flowering area and limit the hours.',
      'Kompromi yang diguna pakai di sini: letakkan lampu di pinggir blok di sebelah datangnya tekanan perosak; alihkan ke zon buah yang dilindungi semasa pembentukan buah; dan semasa berbunga jauhkan dari kawasan berbunga serta hadkan jam penggunaannya.'))+'</p></div>'
    + '<div class="card"><h3>'+(L('先定一件事：你要监测还是要诱杀', 'Decide one thing first: monitoring or mass trapping', 'Tentukan satu perkara dahulu: pemantauan atau pemerangkapan besar-besaran'))+'</h3>'
    + '<p class="note">'+(L('<b>默认走监测。</b>每 200 m² 一张（约每英亩 20 张），位置固定，每周计数，用来决定什么时候动手。诱杀是每 2–5 m² 一张、只铺热点那一片，不铺全园——两者的天敌代价差一个数量级，而诱杀在乔木果园的证据远比在封闭温室里弱。榴莲园不是温室。',
      '<b>Default to monitoring.</b> One card per 200 m², roughly 20 per acre, fixed positions, counted weekly, used to time an intervention. Mass trapping is one per 2–5 m² over a hotspot only, never block-wide — the predator cost differs by an order of magnitude, and the evidence is far weaker in tree orchards than in closed greenhouses. A durian block is not a greenhouse.',
      '<b>Pilih pemantauan sebagai lalai.</b> Satu papan bagi setiap 200 m², lebih kurang 20 bagi setiap ekar, kedudukan tetap, dikira setiap minggu, digunakan untuk menentukan masa tindakan kawalan. Pemerangkapan besar-besaran ialah satu bagi setiap 2–5 m² di kawasan serangan tinggi sahaja, tidak sekali-kali di seluruh blok — kos terhadap pemangsa berbeza kira-kira sepuluh kali ganda, dan buktinya jauh lebih lemah di dusun pokok berbanding rumah hijau tertutup. Blok durian bukan rumah hijau.'))
    + ' '+badge('field')+'</p></div>';
