<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1119">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="虫眼光谱">
<title>虫眼光谱 · 昆虫视觉与趋光实验室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1119'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23b98cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f2d64b'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0d1017;
  --ink2:#181e2c;
  --ink3:#222a3a;
  --line:#39435c;
  --bone:#f5f3ed;
  --mute:#c9d1e3;
  --uv:#b083ff;
  --blu:#6fa3ff;
  --grn:#5ad79c;
  --yel:#f7cf52;
  --org:#f79a4e;
  --red:#f0716a;
  --ok:#5ad79c;
  --warn:#f7cf52;
  --bad:#f0716a;
  --radius:12px;
}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.fs-l{font-size:20.5px}
html.fs-xl{font-size:23px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:1rem;line-height:1.72;font-weight:450;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:Georgia,"Songti SC","Noto Serif CJK SC","Times New Roman",serif;font-weight:700;line-height:1.3;margin:0}
a{color:var(--blu)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(13,16,23,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
}
.brandrow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:nowrap}
.brandrow h1{font-size:1.55rem;letter-spacing:.5px;line-height:1.2;min-width:0}
header #bSub{margin:3px 0 0;font-size:0.9rem;color:var(--mute);font-weight:500;line-height:1.3}
.ctrls{display:flex;gap:6px;flex:none;padding-bottom:2px}
.ctrls #fsbtn{display:flex;align-items:baseline;gap:3px;padding:6px 15px 7px;line-height:1}
.ctrls #fsbtn .fsref{font-size:.72em;opacity:.5;font-weight:700}
.ctrls #fsbtn .fscur{font-weight:700;transition:font-size .12s ease}
#fsbtn.fs-m .fscur{font-size:1em}
#fsbtn.fs-l .fscur{font-size:1.3em}
#fsbtn.fs-xl .fscur{font-size:1.62em}
.ctrls button{
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:0.96rem;font-weight:600;color:var(--bone);background:var(--ink2);
  white-space:nowrap;
}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 10px}
nav button{
  min-height:44px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:6px 3px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink2);color:var(--mute);
  /* nav is chrome, not reading content: it sizes to the viewport, not to the
     Aa setting, so eight labels always fit without scrolling */
  font-size:clamp(13px, 3.5vw, 16px);font-weight:600;line-height:1.2;
  overflow-wrap:anywhere;
}
nav button.on{
  background:var(--yel);border-color:var(--yel);color:#0d1017;font-weight:700;
}
@media(min-width:620px){
  nav button{min-height:3rem;font-size:1.02rem}
}
main{padding:18px 14px 60px;max-width:760px;margin:0 auto}
section{display:none}
section.on{display:block}

/* ---------- generic ---------- */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:1.08rem;margin-bottom:8px}
.lede{color:var(--mute);font-size:0.94rem;font-weight:450;margin:0 0 16px}
.sub{color:var(--mute);font-size:0.88rem}
.hr{height:1px;background:var(--line);margin:14px 0}
ul.tight{margin:10px 0 0;padding-left:20px;font-size:0.94rem}
ul.tight li{margin-bottom:8px}
.kv{display:flex;gap:10px;font-size:0.9rem;padding:6px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 6.2em;color:var(--mute);font-weight:600}

/* evidence badges */
.ev{display:inline-block;font-size:0.88rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;vertical-align:middle;white-space:nowrap;line-height:1.6}
.ev-measured{color:#8bf0c1;border-color:#3a8564;background:#12291f}
.ev-field{color:#a3c4ff;border-color:#3f5888;background:#151c2c}
.ev-mech{color:#e2c9ff;border-color:#674592;background:#1e1729}
.ev-schem{color:var(--mute);border-color:var(--line);background:var(--ink3)}
.ev-wrong{color:#ffb0a8;border-color:#96443c;background:#2c1614}

/* ---------- spectrum scrubber ---------- */
.scrub{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.nmbig{font-family:Georgia,serif;font-size:2.9rem;font-weight:700;line-height:1;letter-spacing:-1px}
.nmbig small{font-size:1rem;color:var(--mute);letter-spacing:0;margin-left:5px;font-weight:600}
.bandname{margin-top:6px;min-height:4.05rem}
.bandname b{display:block;font-size:1.08rem;font-weight:700;color:var(--bone);line-height:1.35}
.bandname span{display:block;font-size:0.9rem;font-weight:500;color:var(--mute);line-height:1.4;
  margin-top:2px;min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{position:relative;height:30px;border-radius:6px;margin:16px 0 6px;overflow:hidden}
.bar .tick{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px #000}
input[type=range]{width:100%;margin:0;height:32px;accent-color:var(--yel)}
.axis{display:flex;justify-content:space-between;font-size:0.92rem;font-weight:600;color:var(--bone);margin-top:4px}

.rechead{display:flex;align-items:center;gap:8px;margin-top:18px;
  font-size:0.9rem;font-weight:600;color:var(--mute)}
#recCurves{display:block;width:100%;height:4rem;margin-top:8px;
  background:var(--ink3);border-radius:8px;
  touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.bar{touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.rec{margin-top:10px}
.recrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.recrow span.nm{flex:0 0 8.8em;min-width:0}
.recrow span.nm b{display:block;font-size:1rem;font-weight:700;color:var(--bone);line-height:1.3}
.recrow span.nm i{display:block;font-style:normal;font-size:0.9rem;font-weight:500;color:var(--mute);line-height:1.3}
.recbar{flex:1;height:14px;background:var(--ink3);border-radius:7px;overflow:hidden}
.recbar i{display:block;height:100%;border-radius:7px;transition:width .12s linear}
.recrow em{flex:0 0 4.4em;text-align:right;font-size:0.94rem;font-style:normal;font-weight:700;color:var(--bone)}

.hitlist{margin-top:12px}
.hit{display:flex;align-items:baseline;gap:9px;padding:7px 0 7px 2px}
.hit .dots{flex:0 0 3.1em;letter-spacing:1px;font-size:1rem}
.hit .nmz{flex:1;font-size:0.94rem;font-weight:500}
.covgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.covcell{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ink2);
  padding:0;display:flex;flex-direction:column}
.covcell.on{border-color:var(--bone)}
.covsvg{display:block;width:100%;height:60px}
.covpc{padding:6px 0;font-size:0.92rem;font-weight:700;color:var(--mute)}
.covcell.on .covpc{color:var(--ink);background:var(--bone)}
.card.cov-ok{border-color:#3a8564}
.card.cov-warn{border-color:#7a6427}
.card.cov-bad{border-color:#96443c}
.mgroup{margin-top:14px}
.mgroup:first-child{margin-top:4px}
.mghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 0;border-top:1px solid var(--line)}
.mgname{font-size:0.98rem;font-weight:700;color:var(--bone)}
.mgcount{font-size:0.8rem;font-weight:700;color:var(--mute);background:var(--ink3);
  border-radius:999px;padding:1px 9px}
.chev{margin-left:auto;flex:none;display:flex;align-items:center;justify-content:center;
  width:1.9em;height:1.9em;border-radius:50%;border:1px solid var(--line);color:var(--mute);
  transition:transform .18s ease,color .18s ease}
.chev svg{width:.78em;height:.52em;overflow:visible}
.chev svg path{fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.mghead.open .chev,.sphead.open .chev{transform:rotate(180deg);color:var(--bone);border-color:var(--mute)}
.modenote{display:none;font-size:0.9rem;color:var(--mute);background:var(--ink3);
  border-radius:8px;padding:11px 13px;margin:2px 0 8px}
.modenote.open{display:block}
.empty{color:var(--mute);font-size:0.92rem;padding:16px 0;text-align:center}

/* ---------- species ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:0.88rem;font-weight:600;color:var(--mute);background:var(--ink2)}
.chip.on{color:#0d1017;background:var(--yel);border-color:var(--yel);font-weight:700}
.sp{background:var(--ink2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden}
.sp>button{width:100%;text-align:left;padding:14px;display:flex;align-items:center;gap:11px}
.sp .swatch{flex:none;width:9px;height:38px;border-radius:3px}
.sp .ttl{flex:1;min-width:0}
.sp .ttl b{display:block;font-size:1.02rem;font-weight:700}
.sp .ttl i{display:block;font-style:italic;font-size:0.88rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbody{display:none;padding:14px 14px 16px;border-top:1px solid var(--line)}
.sp.open .spbody{display:block}
.peaks{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.peak{font-size:0.88rem;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--ink3)}
.note{font-size:0.96rem;line-height:1.72;margin:10px 0 0}
.note b{color:var(--bone);font-weight:700}

/* ---------- advisor ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.opt{border:1px solid var(--line);background:var(--ink2);border-radius:10px;padding:13px;text-align:left;font-size:0.94rem;font-weight:500}
.opt.on{border-color:var(--yel);background:#2a2410;color:#fff;font-weight:700}
.opt small{display:block;color:var(--mute);font-size:0.88rem;font-weight:450;margin-top:3px}
.rx{border-left:4px solid var(--yel);padding-left:14px;margin-top:18px}
.rx h3{font-size:1.15rem}
.caution{background:#2a2410;border:1px solid #7a6427;border-radius:10px;padding:13px;font-size:0.92rem;margin-top:12px;color:#f8e9c2}
.caution b{color:#f9d97a;font-weight:700}

/* ---------- refs ---------- */
.ref{font-size:0.88rem;padding:11px 0;border-bottom:1px solid var(--line);color:var(--mute)}
.ref b{color:var(--bone);font-weight:700}
.ref a{color:var(--blu);text-decoration:none;border-bottom:1px solid rgba(111,163,255,.4)}
.sharecard{margin-bottom:14px}
.sharerow{display:flex;gap:14px;align-items:center}
.qrbox{flex:none;width:128px;height:128px;background:#fff;border-radius:10px;padding:9px}
.qrbox svg{display:block;width:100%;height:100%}
.sharetxt{min-width:0}
@media(max-width:359px){ .sharerow{flex-direction:column;align-items:flex-start} }
.refkind{display:inline-block;font-size:0.78rem;font-weight:700;padding:1px 8px;border-radius:999px;
  border:1px solid var(--line);margin:0 6px 4px 0}
.rk-paper{color:#8bf0c1;border-color:#3a8564}
.rk-preprint{color:#e2c9ff;border-color:#674592}
.rk-practice{color:#a3c4ff;border-color:#3f5888}
.rk-official{color:var(--mute)}
.rk-note{color:#f9d97a;border-color:#7a6427}
.rk-nofix{color:var(--mute);background:var(--ink3)}
footer{color:var(--mute);font-size:0.88rem;text-align:center;padding:26px 14px 44px;line-height:1.75}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:620px){ .kv b{flex-basis:9em} }
</style>

<body>

<header>
  <div class="brandrow">
    <h1 id="bTitle">虫眼光谱</h1>
    <div class="ctrls">
      <button id="fsbtn" aria-label="Text size"><span class="fsref">A</span><span class="fscur">A</span></button>
      <button id="langbtn" aria-label="Language">中文</button>
    </div>
  </div>
  <p id="bSub">昆虫视觉与趋光实验室</p>
  <nav id="nav"></nav>
</header>

<main>
  <section id="v-spectrum" class="on"></section>
  <section id="v-mech"></section>
  <section id="v-species"></section>
  <section id="v-cardid"></section>
  <section id="v-advisor"></section>
  <section id="v-durian"></section>
  <section id="v-veg"></section>
  <section id="v-refs"></section>
</main>

<footer id="foot"></footer>

<script>
"use strict";
var CACHE_VERSION = 'insecteye-v4.0.0-20260901';
var LANG = 'zh';
var FS = 'm';
var FS_STEPS = ['m','l','xl'];
var FS_LABEL = {
  m:{zh:'字号 中',en:'Text M'},
  l:{zh:'字号 大',en:'Text L'},
  xl:{zh:'字号 特大',en:'Text XL'}
};
function applyFs(){
  var h = document.documentElement;
  h.classList.remove('fs-l','fs-xl');
  if(FS === 'l') h.classList.add('fs-l');
  if(FS === 'xl') h.classList.add('fs-xl');
  var b = document.getElementById('fsbtn');
  if(b){
    b.className = 'fs-'+FS;
    b.setAttribute('aria-label', LANG==='zh' ? FS_LABEL[FS].zh : FS_LABEL[FS].en);
  }
}

/* =========================================================
   Evidence tiers. Every substantive claim carries one.
   measured = published electrophysiology / spectral measurement
   field    = published field or choice-test trial
   mech     = inference from an accepted mechanism, not directly measured
   wrong    = contradicted by the primary literature
   ========================================================= */
var EV = {
  measured:{zh:'实测',en:'Measured',cls:'ev-measured'},
  field:{zh:'田间试验',en:'Field trial',cls:'ev-field'},
  mech:{zh:'机理推断',en:'Mechanism',cls:'ev-mech'},
  schematic:{zh:'示意，非实测',en:'Schematic, not measured',cls:'ev-schem'},
  wrong:{zh:'需修正',en:'Needs fixing',cls:'ev-wrong'}
};
function badge(tier){
  var e = EV[tier]; if(!e) return '';
  return '<span class="ev '+e.cls+'">'+(LANG==='zh'?e.zh:e.en)+'</span>';
}

var T = {
  nav:{
    spectrum:{zh:'光谱',en:'Spectrum'},
    mech:{zh:'机理',en:'How it works'},
    species:{zh:'虫谱',en:'Insects'},
    cardid:{zh:'换板',en:'When to replace'},
    advisor:{zh:'选灯选板',en:'Pick a trap'},
    durian:{zh:'榴莲园',en:'Durian'},
    veg:{zh:'菜园',en:'Vegetables'},
    refs:{zh:'资料来源',en:'Sources'}
  }
};
function t(o){ return LANG==='zh' ? o.zh : o.en; }

/* =========================================================
   Photoreceptor templates — SCHEMATIC, not measured spectra.
   Typical insect trichromat: UV ~350, blue ~440, green ~530.
   ========================================================= */
var RECEPTORS = [
  {id:'uv', max:350, sig:34, color:'#b083ff', zh:'紫外受体 UV', en:'UV receptor', nm:'~350 nm'},
  {id:'blue', max:440, sig:42, color:'#6fa3ff', zh:'蓝受体 Blue', en:'Blue receptor', nm:'~440 nm'},
  {id:'green', max:530, sig:58, color:'#5ad79c', zh:'绿受体 Green', en:'Green receptor', nm:'~530 nm'}
];
function excite(nm, r){
  var d = (nm - r.max) / r.sig;
  var v = Math.exp(-0.5*d*d);
  if(nm > r.max) v += 0.10*Math.exp(-0.5*Math.pow((nm-r.max)/(r.sig*2.4),2));
  return Math.min(1, v);
}
/* Continuous wavelength -> sRGB across the visible range (Bruton's
   approximation, gamma 0.8), with an intensity floor so the band edges stay
   legible on a dark background. Below 380 nm there is no true colour — UV is
   invisible — so it is drawn as a deepening violet by convention. */
function wlRGB(nm){
  var r=0,g=0,b=0,f=1;
  if(nm < 380){
    /* UV is invisible: ramp a violet that meets the 380 nm value exactly,
       so the bar has no seam where physical colour begins. */
    var k = Math.max(0, Math.min(1, (nm-300)/80));
    return [Math.round(55+104*k), Math.round(18-18*k), Math.round(95+64*k)];
  }
  if(nm<440){ r=-(nm-440)/60; g=0; b=1; }
  else if(nm<490){ r=0; g=(nm-440)/50; b=1; }
  else if(nm<510){ r=0; g=1; b=-(nm-510)/20; }
  else if(nm<580){ r=(nm-510)/70; g=1; b=0; }
  else if(nm<645){ r=1; g=-(nm-645)/65; b=0; }
  else { r=1; g=0; b=0; }
  if(nm<420) f = 0.55 + 0.45*(nm-380)/40;
  else if(nm>700) f = 0.30 + 0.70*(780-nm)/80;
  if(f<0.30) f = 0.30;
  function ch(v){ return Math.round(255*Math.pow(Math.max(0,v)*f, 0.8)); }
  return [ch(r),ch(g),ch(b)];
}
function nmToCss(nm){
  var c = wlRGB(nm);
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
/* Same hue, lifted for use as text on the dark background. */
function nmToText(nm){
  var c = wlRGB(nm), m = Math.max(c[0],c[1],c[2]);
  var k = m < 170 ? 170/Math.max(m,1) : 1;
  return 'rgb('+Math.min(255,Math.round(c[0]*k))+','+Math.min(255,Math.round(c[1]*k))+','+Math.min(255,Math.round(c[2]*k))+')';
}
/* A gradient sampled across a band, so the middle of the band is shown too. */
function bandGradient(lo,hi,deg){
  var stops=[], steps=8;
  for(var i=0;i<=steps;i++){
    var nm = lo + (hi-lo)*i/steps;
    stops.push(nmToCss(nm)+' '+Math.round(i/steps*100)+'%');
  }
  return 'linear-gradient('+(deg||180)+'deg,'+stops.join(',')+')';
}

var BANDS = [
  {lo:100,hi:280,zh:'UV-C',en:'UV-C',
   noteZh:'被大气吸收，地表几乎没有',noteEn:'absorbed by the atmosphere'},
  {lo:280,hi:315,zh:'UV-B',en:'UV-B',noteZh:'',noteEn:''},
  {lo:315,hi:400,zh:'UV-A',en:'UV-A',
   noteZh:'黑光灯与诱虫灯的主力波段',noteEn:'the black-light trap band'},
  {lo:400,hi:420,zh:'紫光',en:'Violet',noteZh:'',noteEn:''},
  {lo:420,hi:480,zh:'蓝光',en:'Blue',
   noteZh:'蓝板波段',noteEn:'the blue-card band'},
  {lo:480,hi:500,zh:'青蓝',en:'Cyan',noteZh:'',noteEn:''},
  {lo:500,hi:560,zh:'绿光',en:'Green',
   noteZh:'多数植食昆虫的绿受体所在',noteEn:'where most herbivore green receptors sit'},
  {lo:560,hi:600,zh:'黄光',en:'Yellow',
   noteZh:'黄板波段。这是人眼的黄，不是虫眼的峰',noteEn:'the yellow-card band — our yellow, not their peak'},
  {lo:600,hi:620,zh:'橙光',en:'Orange',noteZh:'',noteEn:''},
  {lo:620,hi:700,zh:'红光',en:'Red',
   noteZh:'多数昆虫近乎看不见',noteEn:'near-invisible to most insects'}
];
/* The swatch on each insect card is derived, never chosen: it renders the band
   carrying that group's strongest documented response, as a gradient from the
   low edge of the band to the high edge. A broad band therefore looks broad. */
/* One table, used everywhere a band's route is named. Kept parallel between
   languages: same structure, same level of concreteness, no recommendation. */

function chevron(){
  return '<i class="chev" aria-hidden="true"><svg viewBox="0 0 12 8">'
       + '<path d="M1.5 2 L6 6.2 L10.5 2"/></svg></i>';
}

function bestBand(sp){
  var b = null;
  for(var i=0;i<sp.resp.length;i++){
    if(!b || sp.resp[i].level > b.level) b = sp.resp[i];
  }
  return b;
}
function swatchStyle(sp){
  var b = bestBand(sp);
  if(!b) return 'background:#4d566e';
  return 'background:'+bandGradient(b.lo,b.hi,180);
}
function bandText(sp){
  var b = bestBand(sp);
  if(!b) return LANG==='zh' ? '无可引用的颜色反应数据' : 'no citable colour-response data';
  return b.lo+'–'+b.hi+' nm · '+modeLabel(b.mode);
}

function bandOf(nm){
  for(var i=0;i<BANDS.length;i++) if(nm>=BANDS[i].lo && nm<BANDS[i].hi) return BANDS[i];
  return BANDS[BANDS.length-1];
}

/* Drag anywhere on the curve strip or the colour bar to scrub — the same
   wavelength state drives the slider, tick, cursor and hit list. The range
   input stays the keyboard path; these are pointer shortcuts on top of it. */
function attachScrub(el){
  if(!el) return;
  var sl = document.getElementById('nmSlider');
  function apply(ev){
    var r = el.getBoundingClientRect();
    if(!r.width) return;
    var f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    var v = Math.round((300 + f*400)/5)*5;
    if(v !== curNm){ curNm = v; sl.value = v; updateSpectrum(); }
  }
  el.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    apply(ev);
  });
  el.addEventListener('pointermove', function(ev){
    if(ev.buttons) apply(ev);
  });
}

var CURVE_H = 64, CURVE_PAD = 5;
function curveY(v){ return CURVE_H - CURVE_PAD - v*(CURVE_H - 2*CURVE_PAD); }
function buildCurves(){
  var svg = document.getElementById('recCurves');
  if(!svg) return;
  var h = '';
  for(var i=0;i<RECEPTORS.length;i++){
    var r = RECEPTORS[i], fill = 'M 300 '+curveY(0), line = '';
    for(var nm=300;nm<=700;nm+=4){
      var y = curveY(excite(nm,r)).toFixed(1);
      fill += ' L '+nm+' '+y;
      line += (line ? ' L ' : 'M ')+nm+' '+y;
    }
    fill += ' L 700 '+curveY(0)+' Z';
    /* dashed stroke on purpose: these are the schematic template curves,
       and a solid line would read as measured data */
    h += '<path d="'+fill+'" fill="'+r.color+'" opacity="0.13"/>'
       + '<path d="'+line+'" fill="none" stroke="'+r.color+'" stroke-width="1.8" stroke-dasharray="3 3.5" opacity="0.9"/>';
  }
  h += '<line id="curveCursor" y1="0" y2="'+CURVE_H+'" stroke="#f5f3ed" stroke-width="1.2" opacity="0.85"/>';
  for(var j=0;j<RECEPTORS.length;j++){
    h += '<circle id="curveDot'+j+'" r="3.6" fill="'+RECEPTORS[j].color+'" stroke="#0d1017" stroke-width="1.2"/>';
  }
  svg.innerHTML = h;
}

function updateSpectrum(){
  var nm = curNm;
  var nv = document.getElementById('nmVal'); if(!nv) return;
  nv.innerHTML = nm+'<small>nm</small>';
  nv.style.color = nmToText(nm);
  var b = bandOf(nm);
  document.getElementById('bandName').textContent = t(b);
  document.getElementById('bandNote').textContent = LANG==='zh' ? b.noteZh : b.noteEn;
  document.getElementById('tick').style.left = ((nm-300)/400*100)+'%';

  var rh = '';
  for(var i=0;i<RECEPTORS.length;i++){
    var r = RECEPTORS[i], v = excite(nm,r), pc = Math.round(v*100);
    /* Deliberately a word, not a number: the curve is a generic trichromat
       template, so a two-figure percentage would claim a precision it cannot
       support — real peaks differ between species and even within aphids. */
    var word = v>=0.75 ? {zh:'强',en:'strong'}
             : v>=0.40 ? {zh:'中',en:'moderate'}
             : v>=0.15 ? {zh:'弱',en:'weak'}
             : {zh:'极弱',en:'negligible'};
    rh += '<div class="recrow"><span class="nm"><b>'+t(r)+'</b><i>'+r.nm+'</i></span>'
        + '<span class="recbar"><i style="width:'+pc+'%;background:'+r.color+'"></i></span>'
        + '<em>'+t(word)+'</em></div>';
  }
  document.getElementById('recWrap').innerHTML = rh;
  document.getElementById('recTitle').textContent = LANG==='zh' ? '受体激发' : 'Receptor excitation';
  document.getElementById('recBadge').innerHTML = badge('schematic');
  var cur = document.getElementById('curveCursor');
  if(cur){
    cur.setAttribute('x1', nm); cur.setAttribute('x2', nm);
    for(var ci=0;ci<RECEPTORS.length;ci++){
      var dot = document.getElementById('curveDot'+ci);
      dot.setAttribute('cx', nm);
      dot.setAttribute('cy', curveY(excite(nm, RECEPTORS[ci])).toFixed(1));
    }
  }

  var hits = [];
  for(var s=0;s<SPECIES.length;s++){
    var sp = SPECIES[s], best = null;
    for(var j=0;j<sp.resp.length;j++){
      var band = sp.resp[j];
      if(nm>=band.lo && nm<band.hi){ if(!best || band.level>best.level) best = band; }
    }
    if(best && best.level>0) hits.push({sp:sp,b:best});
  }
  hits.sort(function(a,b){ return b.b.level - a.b.level; });

  var mh = '';
  if(!hits.length){
    mh = '<div class="empty">'+(LANG==='zh'
      ? '这个波长没有已记录的农业相关反应。'+(nm>620?'红光区——多数昆虫的受体到这里已经基本没有输出。':(nm<315?'UV-B／UV-C 在地面几乎不存在，也不用于诱虫。':''))
      : 'No documented agricultural response at this wavelength. '+(nm>620?'Red — most insect receptors have effectively no output here.':(nm<315?'UV-B/UV-C barely reach the ground and are not used for trapping.':'')))+'</div>';
  } else {
    /* Group by route. The explanation belongs to the route, not to each insect,
       so it is written once per group instead of repeating on every row. */
    var order = [], groups = {}, key;
    for(var k=0;k<hits.length;k++){
      var h = hits[k];
      key = MODE_NOTE[h.b.mode] ? h.b.mode : 'both';
      if(!groups[key]){ groups[key] = {max:0, items:[]}; order.push(key); }
      groups[key].items.push(h);
      if(h.b.level > groups[key].max) groups[key].max = h.b.level;
    }
    order.sort(function(x,y){ return groups[y].max - groups[x].max; });
    for(var gi=0; gi<order.length; gi++){
      key = order[gi];
      var g = groups[key];
      mh += '<div class="mgroup">'
          + '<button class="mghead" data-mode="'+key+'" aria-expanded="false">'
            + '<span class="mgname">'+modeLabel(key)+'</span>'
            + '<span class="mgcount">'+g.items.length+'</span>'
            + chevron()+'</button>'
          + '<div class="modenote">'+t(MODE_NOTE[key])+'</div>';
      for(var j=0;j<g.items.length;j++){
        var it = g.items[j];
        var dots = ['','●','●●','●●●'][it.b.level];
        mh += '<div class="hit"><span class="dots" style="color:'+nmToText(nm)+'">'+dots+'</span>'
            + '<span class="nmz">'+t(it.sp)+'</span>'+badge(it.b.tier)+'</div>';
      }
      mh += '</div>';
    }
  }
  var hl = document.getElementById('hitList');
  hl.innerHTML = mh;
  hl.querySelectorAll('.mghead').forEach(function(b){
    b.addEventListener('click', function(){
      var note = b.nextElementSibling;
      if(note && note.classList.contains('modenote')){
        note.classList.toggle('open');
        b.classList.toggle('open');
        b.setAttribute('aria-expanded', note.classList.contains('open') ? 'true' : 'false');
      }
    });
  });

  document.getElementById('modeHint').textContent = LANG==='zh'
    ? '按作用路径分组——黏板和灯是两套机制，不能互换。● 越多＝该波段记录到的反应越强。点标题看这条路径怎么起作用。'
    : 'Grouped by route, because card and lamp are different mechanisms and are not interchangeable. More ● = stronger documented response. Tap a heading to see how that route works.';
}

/* =========================================================
   VIEW: WHEN TO REPLACE A CARD
   A standard-area comparator. People systematically misjudge percent cover by
   eye, so the patches are generated at exact known coverages to compare against.
   ========================================================= */
var COV_STEPS = [5,10,15,20,25,30,35,40,50,60,70,80];
var covPick = 15;
var COV_CACHE = {};

function covPatch(pct, w, hgt){
  var ck = pct+'x'+w+'x'+hgt;
  if(COV_CACHE[ck]) return COV_CACHE[ck];
  /* deterministic placement so a given panel always looks the same */
  var seed = pct*7919 + 13, area = w*hgt;
  /* mulberry32 — a plain LCG degenerates on some seeds and repeats dot
     positions, which silently drops the painted fraction. */
  function rnd(){
    seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  var rx=1.15, ry=0.62, dotArea=Math.PI*rx*ry;
  /* Two corrections, or the panel would not show the coverage it claims.
     1. Ellipses are scaled by a random factor in [0.8,1.3]; mean AREA scales
        by E[s^2] = 1.1233, not by E[s].
     2. Dots land independently and overlap, so visible cover is
        1 - exp(-lambda) for total drawn area lambda. Invert it. */
  var meanS2 = 1.1233;
  var lambda = -Math.log(1 - pct/100);
  /* Scatter centres over the panel PLUS a margin, so dots may overhang and
     clip at the edges. Insetting them instead leaves the margins under-filled,
     and the shortfall grows with coverage. */
  var m = rx*1.3;
  var outerW = w + 2*m, outerH = hgt + 2*m;
  var count = Math.round(outerW*outerH*lambda/(dotArea*meanS2));
  var g='';
  for(var i=0;i<count;i++){
    var cx=rnd()*outerW - m, cy=rnd()*outerH - m;
    var rot=Math.round(rnd()*180), sc=0.8+rnd()*0.5;
    g += '<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+(rx*sc).toFixed(2)
       + '" ry="'+(ry*sc).toFixed(2)+'" transform="rotate('+rot+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
  }
  COV_CACHE[ck] = '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none" class="covsvg">'
       + '<rect width="'+w+'" height="'+hgt+'" fill="#f2d63d"/><g fill="#2b2410">'+g+'</g></svg>';
  return COV_CACHE[ck];
}

function covVerdict(pct){
  if(pct < 15) return {zh:'新板。继续用。',en:'Fresh. Keep using it.',cls:'ok'};
  if(pct < 20) return {zh:'正常。还在有效工作，继续挂。',en:'Normal. Still working — leave it up.',cls:'ok'};
  if(pct < 30) return {zh:'接近该换了。粘力还在，但已经开始变差，下一轮巡园就换掉。',en:'Approaching replacement. Still catching, but falling off — swap it on your next round.',cls:'warn'};
  if(pct < 40) return {zh:'换掉。可用的胶面已经不够，飞过来的虫有相当一部分粘不住了。',en:'Replace it. Too little free adhesive left — a sizeable share of what arrives is no longer being held.',cls:'warn'};
  if(pct < 60) return {zh:'早该换了。这张板现在挡的虫，比它抓的还多。',en:'Well overdue. This card is now blocking more insects than it holds.',cls:'bad'};
  return {zh:'这张板已经不抓虫了，只是挂在那里。如果每次收板都是这个样子，说明换板间隔定得太长，不是虫太多。',en:'This card has stopped catching. It is just hanging there. If cards routinely come back like this, the replacement interval is too long rather than the pressure being high.',cls:'bad'};
}

    + '</ul></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'为什么门槛这么低':'Why the threshold is this low')+' '+badge('field')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '因为一张板的捕获力不是「满了才失效」，而是<b>从第一只虫开始就在往下掉，而且掉得不是线性的</b>。在一项诱蛾板的饱和研究里，虫体和鳞片在胶面上堆积，捕获效率随之下降，每板 50 只以下就已经呈非线性衰减。'

    + '<p class="note">'+(LANG==='zh'
      ? '两件事同时发生：可用的胶面变少，而且已经粘住的虫体本身成了一层垫子，后来的虫踩在上面反而能飞走。所以一张 40% 的板不是「还有 60% 的能力」——它的实际捕获力远低于 60%。'
      : 'Two things happen at once: there is less free adhesive, and the bodies already stuck form a layer that later arrivals can land on and walk off. So a card at 40% cover does not have 60% of its power left — the real figure is well below that.')+'</p>'
    + '<p class="note sub">'+(LANG==='zh'
      ? '（如果你另外还在记数，那就多一条理由：饱和程度不同的两张板，数字之间没有可比性——看起来「虫少了」，其实只是板满了。）'
      : '(If you also keep counts, there is a second reason: two cards at different saturation are not comparable. It reads as fewer insects when it is really just a fuller card.)')+'</p></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'关于 20–30% 这个数字':'On the 20–30% figure')+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(LANG==='zh'

      : 'Stated plainly: no peer-reviewed study gives a standard replacement coverage. The 20–30% figure comes from commercial and extension practice, and the same kind of source elsewhere says 50–70%. I use the lower band because of the saturation curve above — since the decline starts early, setting the threshold low costs a few extra cards, while setting it high costs the comparability of a whole season of numbers.')+'</p></div>';

  el.innerHTML = h;
  /* The twelve panels are ~7000 SVG elements. Re-rendering the view on every
     tap re-parses all of them, so a tap only restyles the cells and rewrites
     the verdict card. */
  var cells = el.querySelectorAll('[data-cov]');
  function paintVerdict(){
    var v = covVerdict(covPick), box = document.getElementById('covVerdict');
    if(!box) return;
    box.className = 'card cov-'+v.cls;
    box.innerHTML = '<h3>'+covPick+'% '+(LANG==='zh'?'覆盖':'covered')+'</h3>'
      + '<p class="note" style="font-size:1.05rem;font-weight:600">'+t(v)+'</p>';
  }
  cells.forEach(function(b){
    b.addEventListener('click', function(){
      covPick = +b.getAttribute('data-cov');
      cells.forEach(function(c){ c.classList.toggle('on', c === b); });
      paintVerdict();
    });
  });
  paintVerdict();
}

          ? '甲基丁香油是<b>气味诱捕</b>，规则和色板、诱虫灯都不同：挂在树冠中层的<b>阴凉处</b>，避开正晒——高温直晒会加快诱芯挥发失效；离叶面留出空间让气味散得开。以园缘和虫源方向为主，果实成熟区周边加密。'
          : 'Methyl eugenol is an <b>odour lure</b>, and its rules differ from both cards and lamps: hang traps in the <b>shaded mid-canopy</b>, out of direct sun — heat and direct exposure shorten the lure\'s life — with clearance around them so the plume can spread. Weight them toward the block margin and the source direction, and add traps around ripening fruit.')+'</p>'
        + '<p class="note sub">'+(LANG==='zh'
          ? '记住它的边界：只诱雄虫。真正压住产卵的是蛋白饵剂和清园落果，诱捕器是配套不是主力。'
          : 'Remember its limit: males only. Egg-laying pressure is controlled by protein bait and windfall sanitation; the traps are the accompaniment, not the lead.')+'</p></div>')
      : isLamp
      ? ('<div class="rx" style="border-left-color:var(--uv)"><h3>'+(LANG==='zh'?'灯装在哪里':'Where to put the lamp')+' '+badge('measured')+'</h3>'
        + '<p class="note">'+(LANG==='zh'
          ? '<b>装在虫来的方向，不是园子中央。</b>诱虫灯是短距离装置——它困住飞近的虫，不会把远处的虫拉过来。所以一盏灯保护的是它周围那一圈，园中央的灯保护的就是园中央。'
          : '<b>Site it toward where the moths come from, not in the middle of the block.</b> A trap lamp is short-range — it traps what flies close rather than drawing insects in. A lamp protects the ring around itself, so a lamp in the centre of the block protects the centre of the block.')+'</p>'
        + '<ul class="tight">'
        + '<li>'+(LANG==='zh'?'<b>几盏小的胜过一盏大的。</b>作用半径以米计，不是以英亩计——「一盏灯管几英亩」这种算法没有依据。':'<b>Several modest lamps beat one powerful one.</b> The useful radius is metres, not acres — "one lamp covers N acres" has no basis.')+'</li>'
        + '<li>'+(LANG==='zh'?'装在<b>虫源边界</b>：邻着的杂林、老园、上一季发生重的那一边。坐果期则装在要保护的果位那一层。':'Put them at the <b>source boundary</b> — the adjacent scrub, the older block, whichever side was worst last season. At fruit set, put them at the fruit zone you are protecting.')+'</li>'
        + '<li>'+(LANG==='zh'?'高度对准目标飞行的那一层。这里不给米数——流传的 1.8–2.5 m 没有试验支持。':'Height goes in the flight layer of the target. No figure here — the 1.8–2.5 m that circulates has no trial behind it.')+'</li>'
        + '<li>'+(LANG==='zh'?'灯下加水盘或黏板承接落虫。傍晚开，约十点关。':'Water tray or sticky plate underneath to catch what drops. On at dusk, off around ten.')+'</li>'
        + '<li>'+(LANG==='zh'?'<b>花期不要装在花房高度。</b>榴莲靠果蝠和夜行昆虫传粉，花期在花层开灯是拿坐果率换蛾。':'<b>Never at flower height during bloom.</b> Durian is bat- and night-insect-pollinated; a lamp in the flowering zone trades fruit set for moths.')+'</li>'
        + '</ul></div>')
      : ('<div class="rx" style="border-left-color:var(--yel)"><h3>'+(LANG==='zh'?'板挂在哪里':'Where to hang the cards')+' '+badge('mech')+'</h3>'
        + '<p class="note">'+(LANG==='zh'
          ? '<b>先保证板是亮的。</b>黏板是反射式陷阱——没有光照在色面上就没有信号，塞在密冠层阴影里的黄板等于一块黑板。挂在冠层外缘、树冠开口处或迎光面，不要往树里塞。'
          : '<b>First, make sure the card is lit.</b> A card is a reflective trap: with no light falling on the coloured surface there is no signal, and a yellow card buried in dense canopy shade is a black rectangle. Hang them at the canopy edge, in a gap, or on the outward face — never deep inside.')+'</p>'
        + '<ul class="tight">'
        + '<li>'+(LANG==='zh'?'<b>高度跟着虫找的那一层走</b>，不是树顶：抽梢期与新梢同高，花期与花房同高，坐果后回到梢层。':'<b>Height follows the layer the insect is searching</b>, not the top of the tree: at the flush during flushing, at panicle height during bloom, back to flush height after fruit set.')+'</li>'
        + '<li>'+(LANG==='zh'?'垂直挂，两面都露出来，与枝叶留开距离——叶子碰到胶面就废了一块。':'Vertical, both faces exposed, clear of branches and leaves — foliage touching the glue writes off that patch.')+'</li>'
        + '<li>'+(LANG==='zh'?'<b>朝向一致、位置固定</b>（例如全部东西向）。这样看到的变化是园子的变化，不是你挂法的变化。':'<b>Same orientation, fixed positions</b> (all facing east–west, say), so what changes is the block rather than your placement.')+'</li>'
        + '<li>'+(LANG==='zh'?'<b>多出来的板放边界。</b>虫是从外面进来的——芒果园的数据显示捕获量随离园边距离下降，板也总是两侧和上缘先满。所以园边、迎风面、去年的热点各加一张，比全园平均摊开有用。':'<b>Extra cards go on the boundary.</b> Insects arrive from outside — mango orchard data shows catch falling with distance from the edge, and cards fill at their side and top margins first. One extra at the block edge, on the windward side, and at last season\'s hotspots beats spreading them evenly.')+'</li>'
        + (advT==='gnat' ? '<li>'+(LANG==='zh'?'<b>真菌蚊例外：平放</b>在基质表面，不要竖挂——成虫从基质羽化，贴着表面飞。':'<b>Fungus gnats are the exception: lay them flat</b> on the media rather than hanging — the adults emerge from the medium and fly low.')+'</li>' : '')
        + '</ul></div>');
    body += isLure
      ? ('<div class="rx" style="border-left-color:var(--grn)"><h3>'+(LANG==='zh'?'挂几个':'How many traps')+' '+badge('mech')+'</h3>'
        + '<p class="note">'+(LANG==='zh'
          ? '监测用途下少量即可：园缘和成熟区各挂一两个、位置固定，比全园铺开更能告诉你虫什么时候进来。没有可引用的榴莲园密度试验，所以这里不给「每英亩几个」。'
          : 'For monitoring, a few are enough: one or two at the margin and around ripening fruit, in fixed positions, tell you more about when flies arrive than a blanket layout would. No published durian density trial exists, so no per-acre figure is given.')+'</p></div>')
      : isLamp
      ? ('<div class="rx" style="border-left-color:var(--grn)"><h3>'+(LANG==='zh'?'装几盏':'How many lamps')+' '+badge('mech')+'</h3>'
        + '<p class="note">'+(LANG==='zh'
          ? '<b>没有可引用的「每英亩几盏」。</b>既然作用是短距离的，盏数取决于你要护住哪几片，而不是园子有多大：先在压力最高的那一边装一盏，看它周围实际管到多远，再按同样的间距往两边补。'
          : '<b>There is no citable lamps-per-acre figure.</b> Since the range is short, the number follows from which patches you need covered rather than from block area. Put one on the highest-pressure side, see how far its effect actually reaches, then add at that spacing.')+'</p>'
        + '<p class="note sub">'+(LANG==='zh'
          ? '宁可几盏小的，不要一盏大的——加功率不会等比例放大作用半径，只会多招非靶标。'
          : 'Prefer several small lamps to one large one — raising wattage does not widen the effective radius proportionally, it mostly adds non-targets.')+'</p></div>')
      : ('<div class="rx" style="border-left-color:var(--grn)"><h3>'+(LANG==='zh'?'挂多少':'How many cards')+' '+badge('field')+'</h3>'
        + '<p class="note">'+t(dens)+'</p>'
        + '<p class="note sub">'+(LANG==='zh'
          ? '这是监测密度：够你知道虫来了没有、什么时候来。全园最少也要有一张，并在园边、迎风面和往年的热点多挂一张。'
          : 'That is monitoring density — enough to tell you whether they have arrived and when. Keep at least one card per management unit, and add one at the block edge, on the windward side, and at last season\'s hotspots.')+'</p></div>');
    if(advG==='suppress'){
      body += '<div class="caution"><b>'+(LANG==='zh'?'诱杀密度的代价':'The cost of mass-trapping density')+'</b><br>'
        + (LANG==='zh'
          ? '把黏板从监测密度加到诱杀密度，捕到的天敌会同比例增加。豇豆田数据：黄板黏到的益虫是蓝板的 1.7 倍，其中瓢虫 63%、小花蝽 29%。诱虫灯把波长调离最佳点时，蛾没有多捕到，非靶标却明显增多。先算清楚你要牺牲多少天敌，再决定要不要铺满。'
          : 'Scaling cards from monitoring to mass-trapping density scales beneficial catch with it. From cowpea data: yellow caught 1.7× the beneficials of blue — 63% ladybirds, 29% Orius. And tuning a lamp off its optimum caught no extra moths but distinctly more non-targets. Price the predator loss before saturating the block.')
        + ' '+badge('field')+'</div>'
        + '<div class="rx" style="border-left-color:var(--org)"><h3>'+(LANG==='zh'?'诱杀要这样挂':'Mass-trapping deployment')+' '+badge('field')+'</h3>'
        + '<p class="note">'+(LANG==='zh'
          ? '每 2–5 m² 一张，<b>只铺热点那一片</b>，不是全园。温室粉虱试验用的就是这个量级（每 5 m² 一张即见显著下降，热点常用到每 2 m² 一张）。全园按这个密度铺，天敌损失和成本都不划算。'
          : 'One card per 2–5 m², <b>over the hotspot only</b>, never the whole block. That is the density greenhouse whitefly trials used — one per 5 m² produced a significant reduction, and one per 2 m² is common in hotspots. Applied block-wide, the predator loss and the cost stop being worth it.')+'</p>'
        + '<p class="note sub">'+(LANG==='zh'
          ? '要有心理准备：即使密度拉满，黏板也压不住一次爆发。它降低的是飞行压力和新定殖，真正把虫口压下去还是要靠其他手段。'
          : 'Expect this much and no more: even at full density, cards will not bring an outbreak down. They reduce flight pressure and new colonisation; something else has to do the actual knockdown.')+'</p></div>';
    }
  }

  el.innerHTML = '<p class="lede">'+(LANG==='zh'
      ? '选目标和目的，得到一条有出处的建议——外加它的代价。'
      : 'Pick a target and a goal for a sourced recommendation, and the cost that comes with it.')+'</p>'
    + '<h3 style="font-size:1.02rem;margin-bottom:10px">'+(LANG==='zh'?'目标害虫':'Target')+'</h3>'
    + '<div class="opts">'+tb+'</div>'
    + '<h3 style="font-size:1.02rem;margin:20px 0 10px">'+(LANG==='zh'?'你要达到什么':'What you want')+'</h3>'
    + '<div class="opts">'+gb+'</div>'
    + body;

  el.querySelectorAll('[data-t]').forEach(function(b){
    b.addEventListener('click',function(){ advT=b.getAttribute('data-t'); renderAdvisor(); });
  });
  el.querySelectorAll('[data-goal]').forEach(function(b){
    b.addEventListener('click',function(){ advG=b.getAttribute('data-goal'); renderAdvisor(); });
  });
}

var DURIAN = [
{ zh:'幼树期（1–3 年）', en:'Young trees (1–3 yrs)',

  doEn:'Yellow cards, about 20 per acre — one per 200 m² — vertical at flush height just above the canopy, checked weekly. Trees are short and canopies thin at this stage, so cards are the most reliable tool of the whole cycle.',

{ zh:'花期', en:'Bloom',

  doEn:'Yellow cards, about 20 per acre, at flower height. The standard advice for bloom is blue, but that comes from Frankliniella. The durian bloom thrips Scirtothrips dorsalis is in the yellow-preferring genus, went to yellow in the six-colour mango trial, and Penang mango work validated yellow-trap counts against actual numbers on the panicles. If catch is still low after two weeks, switch the batch to blue.',
  tier:'field',
  watchZh:'这是全年最该克制的阶段。榴莲花在夜间散粉，主要传粉者是果蝠（尤其是长舌果蝠 Eonycteris spelaea），泰国和苏拉威西的相机陷阱研究都确认了这一点；夜蛾、夜行胡蜂、甲虫甚至蓟马也被记录为次要传粉者。花期在花房高度开 UV 灯，是拿坐果率去换蛾。要开就远离花区、限时。',
  watchEn:'This is the stage to hold back. Durian sheds pollen at night and its main pollinators are fruit bats, above all the cave nectar bat Eonycteris spelaea — confirmed by camera-trap work in Thailand and Sulawesi. Moths, nocturnal wasps, beetles and even thrips are recorded as secondary pollinators. A UV lamp at flower height during bloom trades fruit set for moths. If you run one, keep it away from the flowering zone and limit the hours.' },
{ zh:'坐果期', en:'Fruit set',

  doEn:'UV-A lamps at 365–400 nm, dusk to about ten, at the margin and fruit zone. This step exists for the two fruit-boring moths: the <b>durian fruit borer</b> (the most serious fruit pest) and the <b>durian seed borer</b> (the leading postharvest pest of Thai export durian, for which extension guidance explicitly recommends light traps). For the seed borer there is a hard-evidence companion — <b>bagging</b> at 6 weeks after fruit set, 0% infestation against 5.44% in the trial. Once a borer is inside no lamp reaches it: the window is the adult flight. Cards drop to 4–5 per acre for baseline monitoring.',

  watchEn:'Methyl eugenol lures males only, and only fruit flies — the boring moths are outside its reach. Traps without windfall clearing means counting fruit flies rather than controlling them. And white cottony <b>mealybugs</b> on the fruit surface are not a card or lamp problem — ants and airflow are the levers (see the Insects tab).' }
];

function renderDurian(){
  var el = document.getElementById('v-durian');
  var h = '<p class="lede">'+(LANG==='zh'
    ? '按物候分阶段，每一阶段都给出可以直接照做的默认配置。密度沿用通行的监测惯例：垂直挂在冠层稍上方，每 200 m² 一张，约合每英亩 20 张。榴莲园本身没有专门的密度试验，但这个惯例在多种作物上通用，比凭空猜一个数字可靠得多。先照做，记录捕获量，再按自己的情况加减。'
    : 'By phenological stage, each with a default you can act on directly. Density follows the standard monitoring convention: vertical, just above the canopy, about one card per 200 m² — roughly 20 per acre. There is no density trial specific to durian, but the convention holds across many crops and beats a guessed figure. Follow it, record the catch, then adjust for your own block.')+'</p>';
  for(var i=0;i<DURIAN.length;i++){
    var d = DURIAN[i];
    h += '<div class="card"><h3>'+t(d)+'</h3>'
      + '<div class="kv"><b>'+(LANG==='zh'?'主要害虫':'Main pests')+'</b><span>'+(LANG==='zh'?d.pestZh:d.pestEn)+'</span></div>'
      + '<p class="note">'+(LANG==='zh'?d.doZh:d.doEn)+' '+badge(d.tier)+'</p>'
      + '<div class="caution">'+(LANG==='zh'?d.watchZh:d.watchEn)+'</div></div>';
  }
  h += '<div class="card"><h3>'+(LANG==='zh'?'装在哪里：黏板':'Placement: cards')+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '<b>最容易做错的一条：把板挂进阴影里。</b>黏板靠反射工作，冠层深处没有光照在色面上，那张板就是块黑板。挂在冠层外缘、开口处或迎光面。'
      : '<b>The easiest thing to get wrong is hanging cards in shade.</b> A card works by reflection; deep inside the canopy there is no light on the coloured surface and the card is just a black rectangle. Hang them at the canopy edge, in a gap, or on the outward face.')+'</p>'
    + '<ul class="tight">'
    + '<li>'+(LANG==='zh'?'高度跟着虫找的那一层：抽梢期与新梢同高，花期与花房同高，坐果后回到梢层。乔木不能照搬「冠层稍上方」——那条规则是给矮作物的。':'Height follows the layer the insect is searching: at the flush, then at panicle height during bloom, then back to the flush. Do not copy "just above the canopy" onto a tall tree — that rule was written for low crops.')+'</li>'
    + '<li>'+(LANG==='zh'?'垂直，两面露出，与枝叶留距离；朝向一致、位置固定。':'Vertical, both faces exposed, clear of foliage; same orientation and fixed positions.')+'</li>'
    + '<li>'+(LANG==='zh'?'多的板放园边和迎风面——虫从外面进来，捕获量随离园边距离下降。':'Extra cards on the block edge and windward side — insects arrive from outside, and catch falls with distance from the edge.')+'</li>'
    + '</ul></div>'
    + '<div class="card"><h3>'+(LANG==='zh'?'装在哪里：诱虫灯':'Placement: lamps')+' '+badge('measured')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '<b>灯是短距离的。</b>它困住飞近的虫，不会把远处的虫拉过来——所以它保护的是自己周围那一圈。装在虫来的那一边（邻着的杂林、老园、去年发生最重的一侧），不要装在园子中央；坐果期装在要保护的果位那一层。几盏小的胜过一盏大的。'
      : '<b>Lamps are short-range.</b> They trap what flies close rather than drawing insects in, so a lamp protects the ring around itself. Site them on the side the moths come from — adjacent scrub, an older block, whichever side was worst last season — not in the middle. At fruit set, put them at the fruit zone you are protecting. Several modest lamps beat one powerful one.')+'</p>'
    + '<div class="caution">'+(LANG==='zh'
      ? '<b>花期例外：不要装在花房高度。</b>榴莲主要靠果蝠和夜行昆虫传粉，花期在花层开灯是拿坐果率去换蛾。要开就远离花区并限时。'
      : '<b>Bloom exception: not at flower height.</b> Durian is mainly bat- and night-insect-pollinated, so a lamp in the flowering zone during bloom trades fruit set for moths. If you run one, keep it away from the flowering area and limit the hours.')+'</div></div>'

 bodyEn:'The 2024 three-dimensional flight-path study — lab motion capture plus stereo videography in Costa Rica — found that insects do not steer toward light. They turn their dorsum toward it, producing flight paths perpendicular to the source. This is the dorsal light response: in nature the brightest hemisphere is the sky, so backing onto it tells them which way is up. An artificial source corrupts that reference, producing the orbiting, stalling and inverting. The older "escape to light" and "lunar navigation" explanations were both ruled out by this data.',

},
{

{

{

 bodyEn:'Start with the right framing: <b>red is not a colour to an insect, it is darkness</b>. Most insects have no red receptor, so 620–700 nm raises little signal in any of the three channels and a red surface reads as near-black rather than as red. Where red traps do catch, they are most likely working on brightness contrast — a dark object against a pale background — not on colour preference. Long wavelengths are therefore the least attractive band: moth phototaxis to long-wave lamps runs far below UV, and across lamp types catch falls as the weighted mean wavelength rises. But "no effect" overstates it, and the picture splits. In cabbage moth larval development trials, green and white light affected male caterpillars while red did not differ from darkness. In pheromone trials red did reduce female output and shift the blend, just as green and warm white did. And in a field mating trial, 53% of females mated under a dark control against 28% under red.',

    + '</ul>'
    + '<p class="note sub">'+(LANG==='zh'
      ? '菜园比果园更需要早知道，原因是<b>病毒</b>：蚜虫、白粉虱、蓟马在菜上的主要危害往往是传毒，等看见虫害症状时毒已经进田了。板上最先出现的那几只，就是打药窗口的信号。'
      : 'A vegetable farm needs the early warning more than an orchard does, because of <b>viruses</b>: on vegetables the main damage from aphids, whiteflies and thrips is often the diseases they carry, and by the time feeding symptoms show, the virus is already in the field. The first few on a card are the signal that the treatment window has opened.')+'</p></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'育苗棚与温室':'Nurseries and protected structures')+' '+badge('field')+'</h3>'
    + '<ul class="tight">'
    + '<li>'+(LANG==='zh'?'<b>滤紫外薄膜或防虫网</b>是这里最硬的一招：紫外是蚜虫、白粉虱、蓟马起飞和迁入的信号，把紫外滤掉能明显压低迁入量。露地做不到，棚里做得到。':'<b>UV-blocking film or netting</b> is the strongest tool here: UV is the take-off and immigration cue for aphids, whiteflies and thrips, and cutting it measurably reduces what comes in. Impossible in the open field, possible under cover.')+'</li>'
    + '<li>'+(LANG==='zh'?'育苗盘上的真菌蚊：黄板<b>平放</b>在基质面，每 2 m² 一张。竖挂对它基本无效。':'Fungus gnats over trays: yellow cards <b>flat</b> on the media, one per 2 m². Hanging them does little.')+'</li>'
    + '<li>'+(LANG==='zh'?'<b>诱杀（每 2–5 m² 一张）的证据就来自温室</b>：封闭空间、虫源有限，铺满热点才压得出效果。这一招搬到露地会大打折扣。':'<b>Mass trapping (one per 2–5 m²) is a greenhouse result</b>: a closed space with a finite population is where saturation works. It transfers poorly to the open field.')+'</li>'
    + '</ul></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'瓜实蝇：别买错诱剂':'Melon fly: do not buy the wrong lure')+' '+badge('field')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '瓜类上蛀果的是<b>瓜实蝇（Zeugodacus cucurbitae）</b>，和榴莲、木瓜上那类果实蝇不是同一种。关键差别：<b>它不认甲基丁香油</b>。瓜实蝇的雄虫诱剂是<b>诱蝇酮（cue-lure）</b>——买瓶装诱剂时看清成分，买错了挂一季也是空的。'
      : 'The borer in cucurbits is the <b>melon fly (Zeugodacus cucurbitae)</b> — not the same fly as on durian or papaya. The difference that costs money: <b>it does not respond to methyl eugenol.</b> The male lure for melon fly is <b>cue-lure</b> — read the label before buying, because the wrong bottle hangs empty all season.')+'</p>'
    + '<p class="note sub">'+(LANG==='zh'
      ? '两类通用的手段：蛋白饵剂对雌雄都有效；苦瓜、黄瓜、丝瓜<b>套袋</b>本来就是本地常规做法，对瓜实蝇也最直接。颜色在这里同样不是主线索。'
      : 'What works across both flies: protein bait takes females as well as males, and <b>bagging</b> bitter gourd, cucumber and loofah — already routine local practice — is the most direct defence. Colour, here as with the durian fly, is not the main cue.')+'</p></div>'
    + '<div class="card"><h3>'+(LANG==='zh'?'小菜蛾：灯和板都不是主力':'Diamondback moth: neither lamp nor card is the tool')+' '+badge('mech')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '芥蓝、包菜、小白菜上最难缠的小菜蛾要说清楚：黏板黏到的很少，灯诱证据也薄弱——不要为它买灯。真正的杠杆是轮作断粮、苏云金杆菌（Bt）、保护寄生蜂，以及性信息素诱捕器（那是气味，不是光）。本软件的范围是视觉与趋光，小菜蛾恰好主要不在这个范围里。'
      : 'For diamondback moth on kai lan, cabbage and pak choi, the honest statement is: cards take few, the lamp evidence is thin — do not buy a lamp for it. The working levers are rotation, Bt, protecting its parasitoids, and pheromone traps (an odour tool, not a visual one). This app covers vision and phototaxis, and DBM largely sits outside that scope.')+'</p></div>'
    + '<div class="card"><h3>'+(LANG==='zh'?'夜蛾与灯':'Night moths and lamps')+' '+badge('field')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '斜纹夜蛾、甜菜夜蛾这类夜蛾适用「夜蛾·蛀果蛾」的灯诱规则：UV-A 365–400 nm，傍晚到十点，装在虫来的那一边。菜地通常没有传粉禁区的问题，但灯照着的那几行菜同样会引来产卵——灯别正对着最要保护的畦。'
      : 'Armyworms and similar noctuids follow the same lamp rules as the moths-and-borers target: UV-A 365–400 nm, dusk to ten, sited on the side the moths come from. A vegetable plot rarely has the pollination constraint, but rows lit by the lamp still draw egg-laying — do not point it at the beds you most need to protect.')+'</p></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'菜园的天敌代价':'The bycatch cost on a vegetable farm')+' '+badge('field')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '本软件引用的益虫数据本来就是豆田量的：黄板黏到的天敌是蓝板的 1.7 倍，其中瓢虫 63%、小花蝽 29%。开花的菜（豆、瓜、茄果）边上尤其明显。所以默认监测密度，诱杀只铺热点；潜叶蝇一律不要诱杀——它的寄生蜂比板更能压住它。'
      : 'The beneficial-bycatch figures this app cites were measured on a bean field: yellow takes 1.7× the natural enemies of blue, 63% of them ladybirds and 29% Orius. It shows most beside flowering vegetables. So default to monitoring density, saturate hotspots only — and never mass-trap leafminers, whose parasitoids suppress them better than any card.')+'</p></div>';

  h += '<div class="card"><h3>'+(LANG==='zh'?'换板与认板':'Replacement')+'</h3>'
    + '<p class="note">'+(LANG==='zh'
      ? '换板规则与「换板」页完全相同：覆盖 20–30% 或每周，先到为准；按最密的那一片判断。菜园虫量大，板满得比果园快，旺季常常等不到一周。'
      : 'Replacement is exactly as on the When-to-replace tab: 20–30% cover or weekly, whichever first, judged by the densest patch. Vegetable farms load cards faster than orchards — in season a card often does not last the week.')+'</p></div>';

  el.innerHTML = h;
}

 {url:'https://international-pest-control.com/wordpress/monitoring-and-trapping-with-sticky-traps-whats-new/', a:'Sampson — Monitoring and trapping with sticky traps', t:'International Pest Control, review of current trap deployment practice.', kind:'practice', n:{zh:'常规做法：垂直挂在冠层稍上方，每 200 m² 一张（约每英亩 20 张），随作物长高上移。诱杀：热点每 2 m² 一张；Lu 等（2012）在温室茄子上每 5 m² 一张即显著压低烟粉虱。',en:'Standard practice: vertical, just above the canopy, about one trap per 200 m² (roughly 20 per acre), raised as the crop grows. Mass trapping: one per 2 m² in hotspots; Lu et al. (2012) achieved a significant Bemisia reduction at one per 5 m² in glasshouse aubergine.'}},

 {url:'https://www.umass.edu/agriculture-food-environment/greenhouse-floriculture/fact-sheets/fungus-gnats-shore-flies', a:'UMass Extension; Clemson Land-Grant Press', t:'Fungus gnats and shore flies — greenhouse fact sheets; IPM strategies for fungus gnats in ornamental propagation.', kind:'practice', n:{zh:'放法一致：黄板平放在基质表面或略高处，每 1,000 平方英尺 1–4 张，每周查。颜色一项转述康奈尔的结论：红板捕获量高于黄板。',en:'Consistent on placement: lay yellow cards flat on or just above the media, 1–4 per 1,000 sq ft, checked weekly. On colour they relay the Cornell result that red cards out-caught yellow.'}},
 {a:'Conflicting reports on red vs yellow for fungus gnats', t:'Cornell (relayed by UMass) reports red out-catching yellow; a result attributed to Ohio State reports yellow beating blue, white, green and red.', kind:'note', n:{zh:'两边都只见到推广机构的转述，未见原始试验，方向相反。本软件按未定处理，默认仍用黄板——它买得到，且对其他害虫通用。',en:'Both reach me only as extension summaries, never the primary trials, and they point opposite ways. Treated as unsettled here; yellow remains the default because it is available and works on the other pests too.'}},
 {a:'AQIS durian import risk analysis', t:'Final import risk analysis on the importation of fresh durian fruit.', kind:'official', n:{zh:'榴莲木虱 Allocarsidara malayensis 危害叶片不危害果实；Scirtothrips dorsalis 是榴莲花期害虫；果实蝇 Bactrocera 属的甲基丁香油为雄性专一引诱剂。',en:'Durian psyllid Allocarsidara malayensis attacks foliage not fruit; Scirtothrips dorsalis is a durian flower pest; methyl eugenol is a male-specific lure for Bactrocera fruit flies.'}}

var VIEWS = ['spectrum','mech','species','cardid','advisor','durian','veg','refs'];
var curView = 'spectrum';

function renderNav(){
  var n = document.getElementById('nav'), h='';
  for(var i=0;i<VIEWS.length;i++){
    h += '<button data-v="'+VIEWS[i]+'"'+(curView===VIEWS[i]?' class="on"':'')+'>'+t(T.nav[VIEWS[i]])+'</button>';
  }
  n.innerHTML = h;
  n.querySelectorAll('[data-v]').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-v')); });
  });
}
function show(v){
  curView = v;
  for(var i=0;i<VIEWS.length;i++){
    document.getElementById('v-'+VIEWS[i]).classList.toggle('on', VIEWS[i]===v);
  }
  renderNav();
  window.scrollTo(0,0);
}
function renderAll(){
  document.documentElement.lang = LANG;
  document.getElementById('bTitle').textContent = LANG==='zh' ? '虫眼光谱' : 'InsectEye';
  document.getElementById('bSub').textContent = LANG==='zh' ? '昆虫视觉与趋光实验室' : 'Entomology vision & phototaxis lab';
  document.getElementById('langbtn').textContent = LANG==='zh' ? '中文' : 'EN';
  document.documentElement.lang = LANG==='zh' ? 'zh' : 'en';
  applyFs();
  document.getElementById('foot').innerHTML = (LANG==='zh'
    ? '这里的数字是起点，按你园里的捕获量调整。<br>'+CACHE_VERSION
    : 'The figures here are starting points — adjust them to what your own catch shows.<br>'+CACHE_VERSION);
  renderNav();
  renderSpectrum(); renderMech(); renderSpecies(); renderCoverage(); renderAdvisor();
  renderDurian(); renderVeg(); renderRefs();
  show(curView);
}

document.getElementById('fsbtn').addEventListener('click', function(){
  FS = FS_STEPS[(FS_STEPS.indexOf(FS)+1) % FS_STEPS.length];
  try{ localStorage.setItem('insecteye.fs', FS); }catch(e){}
  applyFs();
});

document.getElementById('langbtn').addEventListener('click', function(){
  LANG = (LANG==='zh') ? 'en' : 'zh';
  try{ localStorage.setItem('insecteye.lang', LANG); }catch(e){}
  renderAll();
});

try{
  var saved = localStorage.getItem('insecteye.lang');
  if(saved === 'en' || saved === 'zh') LANG = saved;
  var fsSaved = localStorage.getItem('insecteye.fs');
  if(FS_STEPS.indexOf(fsSaved) > -1) FS = fsSaved;
}catch(e){}

renderAll();

/* PWA: register only over http(s) — file:// testing stays untouched. The
   version in the query string means a CACHE_VERSION bump re-registers the
   worker and rolls the cache without ever editing sw.js. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js?v='+CACHE_VERSION).catch(function(){});
  });
}
